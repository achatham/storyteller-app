Ship’s gone!’ Well, maybe we’d been taking a glass, and a song to help it round. I won’t say no. Leastways, none of us had looked out. We looked out, and, by thunder! the old ship was gone."}, {"type": "image", "idx": 253, "alt": "The Doctor’s Bargain", "src": "images/p253.webp"}, {"type": "text", "text": "I never seen a pack o’ fools look fishier; and you may lay to that, if I tells you that I looked the fishiest. ‘Well,’ says the doctor, ‘let’s bargain.’ We bargained, him and I, and here we are; stores, brandy, blockhouse, the firewood you was thoughtful enough to cut, and, in a manner of speaking, the whole blessed boat, from crosstrees to keelson. As for them, they’ve tramped; I don’t know where’s they are.”"}, {"type": "text", "text": "He drew again quietly at his pipe.\n\n“And lest you should take it into that head of yours,” he went on, “that you was included in the treaty, here’s the last word that was said: ‘How many are you,’ says I, ‘to leave?’ ‘Four,’ says he﻿—‘four, and one of us wounded. As for that boy, I don’t know where he is, confound him,’ says he, ‘nor I don’t much care. We’re about sick of him.’"}, {"type": "image", "idx": 254, "alt": "The Hard Truth", "src": "images/p254.webp"}, {"type": "text", "text": "These was his words.”\n\n“Is that all?” I asked.\n\n“Well, it’s all you’re to hear, my son,” returned Silver.\n\n“And now I am to choose?”\n\n“And now you are to choose, and you may lay to that,” said Silver."}, {"type": "text", "text": "“Well,” said I, “I am not such a fool but I know pretty well what I have to look for. Let the worst come to the worst, it’s little I care. I’ve seen too many die since I fell in with you. But there’s a thing or two I have to tell you,” I said, and by this time I was quite excited; “and the first is this: Here you are, in a bad way; ship lost, treasure lost, men lost; your whole business gone to wreck; and if you want to know who did it﻿—it was I! I was in the apple barrel the night we sighted land, and I heard you, John, and you, Dick Johnson, and Hands, who is now at the bottom of the sea, and told every word you said before the hour was out. And as for the schooner, it was I who cut her cable, and it was I who killed the men you had aboard of her, and it was I who brought her where you’ll never see her more, not one of you."}, {"type": "image", "idx": 255, "alt": "Jim’s Confession", "src": "images/p255.webp"}, {"type": "text", "text": "The laugh’s on my side; I’ve had the top of this business from the first; I no more fear you than I fear a fly. Kill me, if you please, or spare me. But one thing I’ll say, and no more; if you spare me, bygones are bygones, and when you fellows are in court for piracy, I’ll save you all I can. It is for you to choose. Kill another and do yourselves no good, or spare me and keep a witness to save you from the gallows.”"}, {"type": "text", "text": "I stopped, for, I tell you, I was out of breath, and, to my wonder, not a man of them moved, but all sat staring at me like as many sheep. And while they were still staring I broke out again:\n\n“And now, Mr. Silver,” I said, “I believe you’re the best man here, and if things go to the worst, I’ll take it kind of you to let the doctor know the way I took it.”\n\n“I’ll bear it in mind,” said Silver, with an accent so curious that I could not, for the life of me, decide whether he were laughing at my request or had been favorably affected by my courage.\n\n“I’ll put one to that,” cried the old mahogany-faced seaman﻿—Morgan by name﻿—whom I had seen in Long John’s public-house upon the quays of Bristol. “It was him that knowed Black Dog.”\n\n“Well, and see here,” added the sea-cook, “I’ll put another again to that, by thunder! for it was this same boy that faked the chart from Billy Bones. First and last we’ve split upon Jim Hawkins!”\n\n“Then here goes!” said Morgan, with an oath.\n\nAnd he sprang up, drawing his knife as if he had been twenty."}, {"type": "image", "idx": 256, "alt": "Morgan’s Rage", "src": "images/p256.webp"}, {"type": "text", "text": "“Avast, there!” cried Silver. “Who are you, Tom Morgan? Maybe you thought you were captain here, perhaps. By the powers, but I’ll teach you better! Cross me and you’ll go where many a good man’s gone before you, first and last, these thirty year back﻿—some to the yardarm, shiver my sides!"}, {"type": "image", "idx": 257, "alt": "Silver Intervenes", "src": "images/p257.webp"}, {"type": "text", "text": "and some by the board, and all to feed the fishes. There’s never a man looked me between the eyes and seen a good day a’terward, Tom Morgan, you may lay to that.”\n\nMorgan paused, but a hoarse murmur rose from the others.\n\n“Tom’s right,” said one.\n\n“I stood hazing long enough from one,” added another. “I’ll be hanged if I’ll be hazed by you, John Silver.”"}, {"type": "text", "text": "“Did any of you gentlemen want to have it out with *me*?” roared Silver, bending far forward from his position on the keg, with his pipe still glowing in his right hand. “Put a name on what you’re at; you ain’t dumb, I reckon. Him that wants shall get it. Have I lived this many years to have a son of a rum puncheon cock his hat athwart my hawser at the latter end of it? You know the way; you’re all gentlemen o’ fortune, by your account. Well, I’m ready. Take a cutlass, him that dares, and I’ll see the color of his inside, crutch and all, before that pipe’s empty.”\n\nNot a man stirred; not a man answered."}, {"type": "image", "idx": 258, "alt": "Silver’s Challenge", "src": "images/p258.webp"}, {"type": "text", "text": "“That’s your sort, is it?” he added, returning his pipe to his mouth. “Well, you’re a gay lot to look at, anyway. Not worth much to fight, you ain’t. P’r’aps you can understand King George’s English. I’m cap’n here by ’lection. I’m cap’n here because I’m the best man by a long sea-mile. You won’t fight, as gentlemen o’ fortune should; then, by thunder, you’ll obey, and you may lay to it! I like that boy, now; I never seen a better boy than that. He’s more a man than any pair of rats of you in this here house, and what I say is this: Let me see him that’ll lay a hand on him﻿—that’s what I say, and you may lay to it.”"}, {"type": "text", "text": "There was a long pause after this. I stood straight up against the wall, my heart still going like a sledgehammer, but with a ray of hope now shining in my bosom. Silver leant back against the wall, his arms crossed, his pipe in the corner of his mouth, as calm as though he had been in church; yet his eye kept wandering furtively, and he kept the tail of it on his unruly followers. They, on their part, drew gradually together toward the far end of the blockhouse, and the low hiss of their whispering sounded in my ears continuously, like a stream."}, {"type": "image", "idx": 259, "alt": "The Whispering Council", "src": "images/p259.webp"}, {"type": "text", "text": "One after another they would look up, and the red light of the torch would fall for a second on their nervous faces; but it was not toward me, it was toward Silver that they turned their eyes.\n\n“You seem to have a lot to say,” remarked Silver, spitting far into the air. “Pipe up and let me hear it, or lay to.”\n\n“Ax your pardon, sir,” returned one of the men; “you’re pretty free with some of the rules, maybe you’ll kindly keep an eye upon the rest. This crew’s dissatisfied; this crew don’t vally bullying a marlinspike; this crew has its rights like other crews, I’ll make so free as that; and by your own rules I take it we can talk together. I ax your pardon, sir, acknowledging you for to be capting at this present, but I claim my right and steps outside for a council.”\n\nAnd with an elaborate sea-salute this fellow, a long, ill-looking, yellow-eyed man of five-and-thirty, stepped coolly toward the door and disappeared out of the house."}, {"type": "text", "text": "One after another the rest followed his example, each making a salute as he passed, each adding some apology. “According to rules,” said one. “Foc’s’le council,” said Morgan. And so with one remark or another, all marched out and left Silver and me alone with the torch."}, {"type": "image", "idx": 260, "alt": "Stepping Outside", "src": "images/p260.webp"}, {"type": "text", "text": "The sea-cook instantly removed his pipe.\n\n“Now, look you here, Jim Hawkins,” he said in a steady whisper that was no more than audible, “you’re within half a plank of death, and, what’s a long sight worse, of torture. They’re going to throw me off. But you mark, I stand by you through thick and thin. I didn’t mean to; no, not till you spoke up. I was about desperate to lose that much blunt, and be hanged into the bargain. But I see you was the right sort. I says to myself: You stand by Hawkins, John, and Hawkins’ll stand by you. You’re his last card,"}, {"type": "text", "text": "and by the living thunder, John, he’s yours! Back to back, says I. You save your witness and he’ll save your neck!”\n\nI began dimly to understand.\n\n“You mean all’s lost?” I asked.\n\n“Ay, by gum, I do!” he answered. “Ship gone, neck gone﻿—that’s the size of it. Once I looked into that bay, Jim Hawkins, and seen no schooner﻿—well, I’m tough, but I gave out. As for that lot and their council, mark me, they’re outright fools and cowards. I’ll save your life﻿—if so be as I can﻿—from them. But see here, Jim﻿—tit for tat﻿—you save Long John from swinging.”"}, {"type": "image", "idx": 261, "alt": "Back to Back", "src": "images/p261.webp"}, {"type": "text", "text": "I was bewildered; it seemed a thing so hopeless he was asking﻿—he, the old buccaneer, the ringleader throughout.\n\n“What I can do, that I’ll do,” I said.\n\n“It’s a bargain!” cried Long John. “You speak up plucky, and by thunder, I’ve a chance.”\n\nHe hobbled to the torch, where it stood propped among the firewood, and took a fresh light to his pipe.\n\n“Understand me, Jim,” he said, returning. “I’ve a head on my shoulders, I have. I’m on squire’s side now. I know you’ve got that ship safe somewheres. How you done it I don’t know, but safe it is. I guess Hands and O’Brien turned soft. I never much believed in neither of *them*. Now you mark me. I ask no questions, nor I won’t let others. I know when a game’s up, I do; and I know a lad that’s stanch. Ah, you that’s young﻿—you and me might have done a power of good together!”\n\nHe drew some cognac from the cask into a tin cannikin.\n\n“Will you taste, messmate?” he asked, and when I had refused, “Well, I’ll take a drain myself, Jim,” said he. “I need a caulker, for there’s trouble on hand. And, talking o’ trouble, why did that doctor give me the chart, Jim?”"}, {"type": "image", "idx": 262, "alt": "The Mystery of the Map", "src": "images/p262.webp"}, {"type": "text", "text": "My face expressed a wonder so unaffected that he saw the needlessness of further questions.\n\n“Ah, well, he did, though,” said he. “And there’s something under that, no doubt﻿—something, surely, under that, Jim﻿—bad or good.”\n\nAnd he took another swallow of the brandy, shaking his great fair head like a man who looks forward to the worst."}]}, {"title": "XXIX: The Black Spot Again", "nodes": [{"type": "text", "text": "### XXIX\n\nThe Black Spot Again\n\nThe council of the buccaneers had lasted some time, when one of them reentered the house, and with a repetition of the same salute, which had in my eyes an ironical air, begged for a moment’s loan of the torch. Silver briefly agreed, and this emissary retired again, leaving us together in the dark.\n\n“There’s a breeze coming, Jim,” said Silver, who had by this time adopted quite a friendly and familiar tone.\n\nI turned to the loophole nearest me and looked out. The embers of the great fire had so far burned themselves out, and now glowed so low and duskily, that I understood why these conspirators desired a torch. About halfway down the slope to the stockade they were collected in a group; one held the light; another was on his knees in their midst, and I saw the blade of an open knife shine in his hand with varying colors, in the moon and torchlight. The rest were all somewhat stooping, as though watching the maneuvers of this last. I could just make out that he had a book as well as a knife in his hand; and was still wondering how anything so incongruous had come in their possession, when the kneeling figure rose once more to his feet, and the whole party began to move together toward the house."}, {"type": "image", "idx": 263, "alt": "The Shadowy Council", "src": "images/p263.webp"}, {"type": "text", "text": "“Here they come,” said I; and I returned to my former position, for it seemed beneath my dignity that they should find me watching them.\n\n“Well, let ’em come, lad﻿—let ’em come,” said Silver, cheerily. “I’ve still a shot in my locker.”\n\nThe door opened, and the five men, standing huddled together just inside, pushed one of their number forward. In any other circumstances it would have been comical to see his slow advance, hesitating as he set down each foot, but holding his closed right hand in front of him.\n\n“Step up, lad,” cried Silver. “I won’t eat you. Hand it over, lubber. I know the rules, I do; I won’t hurt a depytation.”\n\nThus encouraged the buccaneer stepped forth more briskly, and having passed something to Silver, from hand to hand, slipped yet more smartly back again to his companions."}, {"type": "image", "idx": 264, "alt": "A Reluctant Deputation", "src": "images/p264.webp"}, {"type": "text", "text": "The sea-cook looked at what had been given him.\n\n“The black spot! I thought so,” he observed. “Where might you have got the paper? Why, hello! look here, now; this ain’t lucky! You’ve gone and cut this out of a Bible. What fool’s cut a Bible?”"}, {"type": "image", "idx": 265, "alt": "The Black Spot", "src": "images/p265.webp"}, {"type": "text", "text": "“Ah, there,” said Morgan, “there! Wot did I say? No good’ll come o’ that, I said.”\n\n“Well, you’ve about fixed it now, among you,” continued Silver. “You’ll all swing now, I reckon. What soft-headed lubber had a Bible?”\n\n“It was Dick,” said one.\n\n“Dick, was it? Then Dick can get to prayers,” said Silver."}, {"type": "text", "text": "“He’s seen his slice of luck, has Dick, and you may lay to that.”\n\nBut here the long man with the yellow eyes struck in.\n\n“Belay that talk, John Silver,” he said. “This crew has tipped you the black spot in full council, as in dooty bound; just you turn it over, as in dooty bound, and see what’s wrote there. Then you can talk.”\n\n“Thanky, George,” replied the sea-cook. “You always was brisk for business, and has the rules by heart, George, as I’m pleased to see. Well, what is it, anyway? Ah! ‘Deposed’﻿—that’s it, is it? Very pretty wrote, to be sure; like print, I swear. Your hand o’ write, George? Why, you was gettin’ quite a leadin’ man in this here crew. You’ll be cap’n next, I shouldn’t wonder. Just oblige me with that torch again, will you? this pipe don’t draw.”"}, {"type": "image", "idx": 266, "alt": "George Merry Steps Forward", "src": "images/p266.webp"}, {"type": "text", "text": "“Come, now,” said George, “you don’t fool this crew no more. You’re a funny man, by your account; but you’re over now, and you’ll maybe step down off that barrel, and help vote.”\n\n“I thought you said you knowed the rules,” returned Silver, contemptuously. “Leastways, if you don’t, I do; and I wait here﻿—and I’m still your cap’n, mind﻿—till you outs with your grievances, and I reply; in the meantime, your black spot ain’t worth a biscuit. After that we’ll see.”\n\n“Oh,” replied George, “you don’t be under no kind of apprehension; *we’re* all square, we are. First, you’ve made a hash of this cruise﻿—you’ll be a bold man to say no to that. Second, you let the enemy out o’ this here trap for nothing. Why did they want out? I dunno, but it’s pretty plain they wanted it. Third, you wouldn’t let us go at them upon the march. Oh, we see through you, John Silver; you want to play booty, that’s what’s wrong with you. And then, fourth, there’s this here boy.”\n\n“Is that all?” asked Silver, quietly."}, {"type": "image", "idx": 267, "alt": "Listing the Grievances", "src": "images/p267.webp"}, {"type": "text", "text": "“Enough, too,” retorted George. “We’ll all swing and sun-dry for your bungling.”\n\n“Well, now, look here, I’ll answer these four p’ints; one after another I’ll answer ’em. I made a hash o’ this cruise, did I? Well, now, you all know what I wanted; and you all know, if that had been done, that we’d ’a’ been aboard the *Hispaniola* this night as ever was, every man of us alive, and fit, and full of good plum-duff, and the treasure in the hold of her, by thunder! Well, who crossed me? Who forced my hand, as was the lawful cap’n? Who tipped me the black spot the day we landed, and began this dance? Ah, it’s a fine dance﻿—I’m with you there﻿—and looks mighty like a hornpipe in a rope’s end at Execution Dock by London town, it does. But who done it? Why, it was Anderson, and Hands, and you, George Merry! And you’re the last above board of that same meddling crew; and you have the Davy Jones insolence to up and stand for cap’n over me﻿—you, that sunk the lot of us! By the powers! but this tops the stiffest yarn to nothing.”"}, {"type": "image", "idx": 268, "alt": "Silver's Rebuttal", "src": "images/p268.webp"}, {"type": "text", "text": "Silver paused, and I could see by the faces of George and his late comrades that these words had not been said in vain.\n\n“That’s for number one,” cried the accused, wiping the sweat from his brow, for he had been talking with a vehemence that shook the house. “Why, I give you my word, I’m sick to speak to you. You’ve neither sense nor memory, and I leave it to fancy where your mothers was that let you come to sea. Sea! Gentlemen o’ fortune! I reckon tailors is your trade.”\n\n“Go on, John,” said Morgan. “Speak up to the others.”\n\n“Ah, the others!” returned John. “They’re a nice lot, ain’t they? You say this cruise is bungled. Ah! by gum, if you could understand how bad it’s bungled, you would see! We’re that near the gibbet that my neck’s stiff with thinking on it. You’ve seen ’em, maybe, hanged in chains, birds about ’em, seamen p’inting ’em out as they go down with the tide. ‘Who’s that?’ says one. ‘That! Why, that’s John Silver. I knowed him well,’ says another. And you can hear the chains a-jangle as you go about and reach for the other buoy. Now, that’s about where we are, every mother’s son of us, thanks to him, and Hands, and Anderson, and other ruination fools of you."}, {"type": "image", "idx": 269, "alt": "The Threat of the Gallows", "src": "images/p269.webp"}, {"type": "text", "text": "And if you want to know about number four, and that boy, why, shiver my timbers! isn’t he a hostage? Are we a-going to waste a hostage? No, not us; he might be our last chance, and I shouldn’t wonder. Kill that boy? not me, mates! And number three? Ah, well, there’s a deal to say to number three. Maybe you don’t count it nothing to have a real college doctor come to see you every day﻿—you, John, with your head broke﻿—or you, George Merry, that had the ague shakes upon you not six hours agone, and has your eyes the color of lemon peel to this same moment on the clock? And maybe, perhaps, you didn’t know there was a consort coming, either? But there is, and not so long till then; and we’ll see who’ll be glad to have a hostage when it comes to that. And as for number two, and why I made a bargain﻿—well, you come crawling on your knees to me to make it﻿—on your knees you came, you was that downhearted﻿—and you’d have starved, too, if I hadn’t﻿—but that’s a trifle! you look there﻿—that’s why!”\n\nAnd he cast down upon the floor a paper that I instantly recognized﻿—none other than the chart on yellow paper, with the three red crosses, that I had found in the oilcloth at the bottom of the captain’s chest. Why the doctor had given it to him was more than I could fancy."}, {"type": "image", "idx": 270, "alt": "The Master Stroke", "src": "images/p270.webp"}, {"type": "text", "text": "But if it were inexplicable to me, the appearance of the chart was incredible to the surviving mutineers. They leaped upon it like cats upon a mouse. It went from hand to hand, one tearing it from another; and by the oaths and the cries and the childish laughter with which they accompanied their examination, you would have thought, not only they were fingering the very gold, but were at sea with it, besides, in safety.\n\n“Yes,” said one, “that’s Flint, sure enough. J. F., and a score below, with a close hitch to it, so he done ever.”\n\n“Mighty pretty,” said George. “But how are we to get away with it, and us no ship?”\n\nSilver suddenly sprang up, and supporting himself with a hand against the wall: “Now, I give you warning, George,” he cried. “One more word of your sauce, and I’ll call you down and fight you. How? Why, how do I know? You had ought to tell me that﻿—you and the rest, that lost me my schooner, with your interference, burn you! But not you, you can’t; you ain’t got the invention of a cockroach. But civil you can speak, and shall, George Merry, you may lay to that.”"}, {"type": "image", "idx": 271, "alt": "Leaping on the Map", "src": "images/p271.webp"}, {"type": "text", "text": "“That’s fair enow,” said the old man Morgan.\n\n“Fair! I reckon so,” said the sea-cook. “You lost the ship; I found the treasure. Who’s the better man at that? And now I resign, by thunder! Elect whom you please to be your cap’n now; I’m done with it.”\n\n“Silver!” they cried. “Barbecue forever! Barbecue for cap’n!”"}, {"type": "image", "idx": 272, "alt": "Barbecue Forever", "src": "images/p272.webp"}, {"type": "text", "text": "“So that’s the toon, is it?” cried the cook. “George, I reckon you’ll have to wait another turn, friend, and lucky for you as I’m not a revengeful man. But that was never my way. And now, shipmates, this black spot? ’Tain’t much good now, is it? Dick’s crossed his luck and spoiled his Bible, and that’s about all.”\n\n“It’ll do to kiss the book on still, won’t it?” growled Dick, who was evidently uneasy at the curse he had brought upon himself.\n\n“A Bible with a bit cut out!” returned Silver, derisively. “Not it. It don’t bind no more’n a ballad-book.”"}, {"type": "text", "text": "“Don’t it, though?” cried Dick, with a sort of joy. “Well, I reckon that’s worth having, too.”\n\n“Here, Jim﻿—here’s a cur’osity for you,” said Silver, and he tossed me the paper.\n\nIt was a round about the size of a crown piece. One side was blank, for it had been the last leaf; the other contained a verse or two of Revelation﻿—these words among the rest, which struck sharply home upon my mind: “Without are dogs and murderers.”"}, {"type": "image", "idx": 273, "alt": "A Night of Troubled Thoughts", "src": "images/p273.webp"}, {"type": "text", "text": "The printed side had been blackened with wood ash, which already began to come off and soil my fingers; on the blank side had been written with the same material the one word “Deposed.” I have that curiosity beside me at this moment; but not a trace of writing now remains beyond a single scratch, such as a man might make with his thumbnail.\n\nThat was the end of the night’s business. Soon after, with a drink all round, we lay down to sleep, and the outside of Silver’s vengeance was to put George Merry up for sentinel, and threaten him with death if he should prove unfaithful.\n\nIt was long ere I could close an eye, and heaven knows I had matter enough for thought in the man whom I had slain that afternoon, in my own most perilous position, and, above all, in the remarkable game that I saw Silver now engaged upon﻿—keeping the mutineers together with one hand, and grasping, with the other, after every means, possible and impossible, to make his peace and save his miserable life. He himself slept peacefully, and snored aloud; yet my heart was sore for him, wicked as he was, to think on the dark perils that environed, and the shameful gibbet that awaited him."}]}, {"title": "XXX: On Parole", "nodes": [{"type": "text", "text": "### XXX\n\nOn Parole\n\nI was wakened﻿—indeed, we were all wakened, for I could see even the sentinel shake himself together from where he had fallen against the doorpost﻿—by a clear, hearty voice hailing us from the margin of the wood:\n\n“Blockhouse, ahoy!” it cried. “Here’s the doctor.”\n\nAnd the doctor it was. Although I was glad to hear the sound, yet my gladness was not without admixture. I remembered with confusion my insubordinate and stealthy conduct; and when I saw where it had brought me﻿—among what companions and surrounded by what dangers﻿—I felt ashamed to look him in the face.\n\nHe must have risen in the dark, for the day had hardly come; and when I ran to a loophole and looked out, I saw him standing, like Silver once before, up to the mid-leg in creeping vapor."}, {"type": "image", "idx": 274, "alt": "The Doctor in the Mist", "src": "images/p274.webp"}, {"type": "text", "text": "“You, doctor! Top o’ the morning to you, sir!” cried Silver, broad awake and beaming with good nature in a moment. “Bright and early, to be sure; and it’s the early bird, as the saying goes, that gets the rations. George, shake up your timbers, son, and help Doctor Livesey over the ship’s side. All a-doin’ well, your patients was﻿—all well and merry.”\n\nSo he pattered on, standing on the hilltop, with his crutch under his elbow, and one hand upon the side of the log-house﻿—quite the old John in voice, manner, and expression."}, {"type": "text", "text": "“We’ve quite a surprise for you, too, sir,” he continued. “We’ve a little stranger here﻿—he! he! A noo boarder and lodger, sir, and looking fit and taut as a fiddle; slep’ like a supercargo, he did, right alongside of John﻿—stem to stem we was, all night.”\n\nDoctor Livesey was by this time across the stockade and pretty near the cook, and I could hear the alteration in his voice as he said:\n\n“Not Jim?”"}, {"type": "image", "idx": 275, "alt": "A Surprise Guest", "src": "images/p275.webp"}, {"type": "text", "text": "“The very same Jim as ever was,” says Silver."}, {"type": "text", "text": "The doctor stopped outright, although he did not speak, and it was some seconds before he seemed able to move on.\n\n“Well, well,” he said at last, “duty first and pleasure afterwards, as you might have said yourself, Silver. Let us overhaul these patients of yours.”\n\nA moment afterwards he had entered the blockhouse, and, with one grim nod to me, proceeded with his work among the sick."}, {"type": "image", "idx": 276, "alt": "A Grim Nod", "src": "images/p276.webp"}, {"type": "text", "text": "He seemed under no apprehension, though he must have known that his life, among these treacherous demons, depended on a hair, and he rattled on to his patients as if he were paying an ordinary professional visit in a quiet English family. His manner, I suppose, reacted on the men, for they behaved to him as if nothing had occurred﻿—as if he were still ship’s doctor, and they still faithful hands before the mast."}, {"type": "text", "text": "“You’re doing well, my friend,” he said to the fellow with the bandaged head, “and if ever any person had a close shave, it was you; your head must be as hard as iron. Well, George, how goes it? You’re a pretty color, certainly; why, your liver, man, is upside down. Did you take that medicine? Did he take that medicine, men?”\n\n“Ay, ay, sir, he took it sure enough,” returned Morgan."}, {"type": "image", "idx": 277, "alt": "The Mutineers' Doctor", "src": "images/p277.webp"}, {"type": "text", "text": "“Because, you see, since I am mutineers’ doctor, or prison doctor, as I prefer to call it,” says Doctor Livesey, in his pleasantest way, “I make it a point of honor not to lose a man for King George (God bless him!) and the gallows.”\n\nThe rogues looked at each other, but swallowed the home-thrust in silence."}, {"type": "text", "text": "“Dick don’t feel well, sir,” said one."}, {"type": "image", "idx": 278, "alt": "The Feverish Pirate", "src": "images/p278.webp"}, {"type": "text", "text": "“Don’t he?” replied the doctor. “Well, step up here, Dick, and let me see your tongue. No, I should be surprised if he did; the man’s tongue is fit to frighten the French. Another fever.”\n\n“Ah, there,” said Morgan, “that comed of sp’iling Bibles.”\n\n“That comed﻿—as you call it﻿—of being arrant asses,” retorted the doctor, “and not having sense enough to know honest air from poison, and the dry land from a vile, pestiferous slough. I think it most probable﻿—though, of course, it’s only an opinion﻿—that you’ll all have the deuce to pay before you get that malaria out of your systems. Camp in a bog, would you? Silver, I’m surprised at you. You’re less of a fool than many, take you all round; but you don’t appear to me to have the rudiments of a notion of the rules of health.\n\n“Well,” he added, after he had dosed them round, and they had taken his prescriptions, with really laughable humility, more like charity schoolchildren than blood-guilty mutineers and pirates, “well, that’s done for today. And now I should wish to have a talk with that boy, please.”"}, {"type": "text", "text": "And he nodded his head in my direction carelessly.\n\nGeorge Merry was at the door, spitting and spluttering over some bad-tasted medicine; but at the first word of the doctor’s proposal he swung round with a deep flush, and cried, “No!” and swore.\n\nSilver struck the barrel with his open hand."}, {"type": "image", "idx": 279, "alt": "Silver Demands Silence", "src": "images/p279.webp"}, {"type": "text", "text": "“Si-lence!” he roared, and looked about him positively like a lion. “Doctor,” he went on, in his usual tones, “I was thinking of that, knowing as how you had a fancy for the boy. We’re all humbly grateful for your kindness, and, as you see, puts faith in you, and takes the drugs down like that much grog. And I take it I’ve found a way as’ll suit all. Hawkins, will you give me your word of honor as a young gentleman﻿—for a young gentleman you are, although poor born﻿—your word of honor not to slip your cable?”\n\nI readily gave the pledge required.\n\n“Then, doctor,” said Silver, “you just step outside o’ that stockade, and once you’re there, I’ll bring the boy down on the inside, and I reckon you can yarn through the spars. Good day to you, sir, and all our dooties to the squire and Cap’n Smollett.”"}, {"type": "text", "text": "The explosion of disapproval, which nothing but Silver’s black looks had restrained, broke out immediately the doctor had left the house. Silver was roundly accused of playing double﻿—of trying to make a separate peace for himself﻿—of sacrificing the interests of his accomplices and victims; and, in one word, of the identical, exact thing that he was doing. It seemed to me so obvious, in this case, that I could not imagine how he was to turn their anger. But he was twice the man the rest were, and his last night’s victory had given him a huge preponderance on their minds. He called them all the fools and dolts you can imagine, said it was necessary I should talk to the doctor, fluttered the chart in their faces, asked them if they could afford to break the treaty the very day they were bound a-treasure-hunting."}, {"type": "image", "idx": 280, "alt": "The Treaty and the Map", "src": "images/p280.webp"}, {"type": "text", "text": "“No, by thunder!” he cried, “it’s us must break the treaty when the time comes; and till then I’ll gammon that doctor, if I have to ile his boots with brandy.”\n\nAnd then he bade them get the fire lit, and stalked out upon his crutch, with his hand on my shoulder, leaving them in a disarray, and silenced by his volubility rather than convinced.\n\n“Slow, lad, slow,” he said. “They might round upon us in a twinkle of an eye if we was seen to hurry.”"}, {"type": "text", "text": "Very deliberately, then, did we advance across the sand to where the doctor awaited us on the other side of the stockade, and as soon as we were within easy speaking distance, Silver stopped."}, {"type": "image", "idx": 281, "alt": "Walking to the Fence", "src": "images/p281.webp"}, {"type": "text", "text": "“You’ll make a note of this here also, doctor,” said he, “and the boy’ll tell you how I saved his life, and were deposed for it, too, and you may lay to that. Doctor, when a man’s steering as near to the wind as me﻿—playing chuck-farthing with the last breath in his body, like﻿—you wouldn’t think it too much, mayhap, to give him one good word! You’ll please bear in mind it’s not my life only now﻿—it’s that boy’s into the bargain; and you’ll speak me fair, doctor, and give me a bit o’ hope to go on, for the sake of mercy.”\n\nSilver was a changed man, once he was out there and had his back to his friends and the blockhouse; his cheeks seemed to have fallen in, his voice trembled; never was a soul more dead in earnest."}, {"type": "text", "text": "“Why, John, you’re not afraid?” asked Doctor Livesey.\n\n“Doctor, I’m no coward; no, not I﻿—not *so* much!” and he snapped his fingers. “If I was I wouldn’t say it. But I’ll own up fairly, I’ve the shakes upon me for the gallows. You’re a good man and a true; I never seen a better man! And you’ll not forget what I done good, not any more than you’ll forget the bad, I know. And I step aside﻿—see here﻿—and leave you and Jim alone. And you’ll put that down for me, too, for it’s a long stretch, is that!”\n\nSo saying, he stepped back a little way till he was out of earshot, and there sat down upon a tree-stump and began to whistle, spinning round now and again upon his seat so as to command a sight, sometimes of me and the doctor, and sometimes of his unruly ruffians as they went to and fro in the sand, between the fire﻿—which they were busy rekindling﻿—and the house, from which they brought forth pork and bread to make the breakfast."}, {"type": "image", "idx": 282, "alt": "A Changed Man", "src": "images/p282.webp"}, {"type": "text", "text": "“So, Jim,” said the doctor, sadly, “here you are. As you have brewed, so shall you drink, my boy. Heaven knows I cannot find it in my heart to blame you; but this much I will say, be it kind or unkind: when Captain Smollett was well you dared not have gone off, and when he was ill, and couldn’t help it by George, it was downright cowardly!”\n\nI will own that I here began to weep. “Doctor,” I said, “you might spare me. I have blamed myself enough; my life’s forfeit anyway, and I should have been dead now if Silver hadn’t stood for me; and, doctor, believe this, I can die﻿—and I dare say I deserve it﻿—but what I fear is torture. If they come to torture me﻿—”\n\n“Jim,” the doctor interrupted, and his voice was quite changed, “Jim, I can’t have this. Whip over, and we’ll run for it.”\n\n“Doctor,” said I, “I passed my word.”\n\n“I know, I know,” he cried. “We can’t help that, Jim, now. I’ll take it on my shoulders, holus-bolus, blame and shame, my boy; but stay here, I cannot let you. Jump! One jump and you’re out, and we’ll run for it like antelopes.”"}, {"type": "image", "idx": 283, "alt": "Silver Watches from Afar", "src": "images/p283.webp"}, {"type": "text", "text": "“No,” I replied, “you know right well you wouldn’t do the thing yourself; neither you, nor squire, nor captain, and no more will I. Silver trusted me; I passed my word, and back I go. But, doctor, you did not let me finish. If they come to torture me, I might let slip a word of where the ship is; for I got the ship, part by luck and part by risking, and she lies in North Inlet, on the southern beach, and just below high water. At half-tide she must be high and dry.”\n\n“The ship!” exclaimed the doctor."}, {"type": "image", "idx": 284, "alt": "The Doctor's Offer", "src": "images/p284.webp"}, {"type": "text", "text": "Rapidly I described to him my adventures, and he heard me out in silence.\n\n“There’s a kind of fate in this,” he observed, when I had done. “Every step it’s you that save our lives, and do you suppose by any chance that we are going to let you lose yours? That would be a poor return, my boy. You found out the plot; you found Ben Gunn﻿—the best deed that ever you did, or will do, though you live to ninety. Oh, by Jupiter! and talking of Ben Gunn, why, this is the mischief in person. Silver!” he cried, “Silver! I’ll give you a piece of advice,” he continued, as the cook drew near again; “don’t you be in any great hurry after that treasure.”\n\n“Why, sir, I do my possible, which that ain’t,” said Silver. “I can only, asking your pardon, save my life and the boy’s by seeking for that treasure; and you may lay to that.”\n\n“Well, Silver,” replied the doctor, “if that is so, I’ll go one step farther; look out for squalls when you find it!”"}, {"type": "image", "idx": 285, "alt": "Jim's Secret", "src": "images/p285.webp"}, {"type": "text", "text": "“Sir,” said Silver, “as between man and man, that’s too much and too little. What you’re after, why you left the blockhouse, why you’ve given me that there chart, I don’t know, now, do I? and yet I done your bidding with my eyes shut and never a word of hope! But no, this here’s too much. If you won’t tell me what you mean plain out, just say so, and I’ll leave the helm.”\n\n“No,” said the doctor, musingly, “I’ve no right to say more; it’s not my secret, you see, Silver, or, I give you my word, I’d tell it you. But I’ll go as far with you as I dare go, and a step beyond, for I’ll have my wig sorted by the captain, or I’m mistaken! And first, I’ll give you a bit of hope. Silver, if we both get out alive out of this wolf-trap, I’ll do my best to save you, short of perjury.”\n\nSilver’s face was radiant. “You couldn’t say more, I am sure, sir, not if you was my mother,” he cried.\n\n“Well, that’s my first concession,” added the doctor. “My second is a piece of advice. Keep the boy close beside you, and when you need help, halloo. I’m off to seek it for you, and that itself will show you if I speak at random. Goodbye, Jim.”\n\nAnd Doctor Livesey shook hands with me through the stockade, nodded to Silver, and set off at a brisk pace into the wood."}, {"type": "image", "idx": 286, "alt": "A Warning for Silver", "src": "images/p286.webp"}]}, {"title": "XXXI: The Treasure-Hunt—Flint’s Pointer", "nodes": [{"type": "text", "text": "### XXXI\n\nThe Treasure-Hunt﻿—Flint’s Pointer\n\n“Jim,” said Silver, when we were alone, “if I saved your life, you saved mine, and I’ll not forget it. I seen the doctor waving you to run for it﻿—with the tail of my eye, I did﻿—and I seen you say no, as plain as hearing. Jim, that’s one to you. This is the first glint of hope I had since the attack failed, and I owe it to you. And now, Jim, we’re to go in for this here treasure-hunting, with sealed orders, too, and I don’t like it; and you and me must stick close, back to back like, and we’ll save our necks in spite o’ fate and fortune.”"}, {"type": "image", "idx": 287, "alt": "A Glint of Hope", "src": "images/p287.webp"}, {"type": "text", "text": "Just then a man hailed us from the fire that breakfast was ready, and we were soon seated here and there about the sand over biscuit and fried junk. They had lighted a fire fit to roast an ox; and it was now grown so hot that they could only approach it from the windward, and even there not without precaution. In the same wasteful spirit, they had cooked, I suppose, three times more than we could eat; and one of them, with an empty laugh, threw what was left into the fire, which blazed and roared again over this unusual fuel."}, {"type": "image", "idx": 288, "alt": "The Wasteful Camp", "src": "images/p288.webp"}, {"type": "text", "text": "I never in my life saw men so careless of the morrow; hand to mouth is the only word that can describe their way of doing; and what with wasted food and sleeping sentries, though they were bold enough for a brush and be done with it, I could see their entire unfitness for anything like a prolonged campaign."}, {"type": "text", "text": "Even Silver, eating away, with Captain Flint upon his shoulder, had not a word of blame for their recklessness. And this the more surprised me, for I thought he had never showed himself so cunning as he did then.\n\n“Ay, mates,” said he, “it’s lucky you have Barbecue to think for you with this here head. I got what I wanted, I did. Sure enough, they have the ship. Where they have it, I don’t know yet; but once we hit the treasure, we’ll have to jump about and find out. And then, mates, us that has the boats, I reckon, has the upper hand.”\n\nThus he kept running on, with his mouth full of the hot bacon; thus he restored their hope and confidence, and, I more than suspect, repaired his own at the same time."}, {"type": "image", "idx": 289, "alt": "Silver's Speech", "src": "images/p289.webp"}, {"type": "text", "text": "“As for hostage,” he continued, “that’s his last talk, I guess, with them he loves so dear. I’ve got my piece o’ news, and thanky to him for that; but it’s over and done. I’ll take him in a line when we go treasure-hunting, for we’ll keep him like so much gold, in case of accidents, you mark, and in the meantime. Once we got the ship and treasure both, and off to sea like jolly companions, why, then we’ll talk Mr. Hawkins over, we will, and we’ll give him his share, to be sure, for all his kindness.”"}, {"type": "text", "text": "It was no wonder the men were in a good humor now. For my part, I was horribly cast down. Should the scheme he had now sketched prove feasible, Silver, already doubly a traitor, would not hesitate to adopt it. He had still a foot in either camp, and there was no doubt he would prefer wealth and freedom with the pirates to a bare escape from hanging, which was the best he had to hope on our side.\n\nNay, and even if things so fell out that he was forced to keep his faith with Doctor Livesey, even then what danger lay before us! What a moment that would be when the suspicions of his followers turned to certainty, and he and I should have to fight for dear life﻿—he, a cripple, and I, a boy﻿—against five strong and active seamen!\n\nAdd to this double apprehension the mystery that still hung over the behavior of my friends; their unexplained desertion of the stockade; their inexplicable cession of the chart; or, harder still to understand, the doctor’s last warning to Silver, “Look out for squalls when you find it”; and you will readily believe how little taste I found in my breakfast, and with how uneasy a heart I set forth behind my captors on the quest for treasure."}, {"type": "image", "idx": 290, "alt": "An Uneasy Heart", "src": "images/p290.webp"}, {"type": "text", "text": "We made a curious figure, had anyone been there to see us; all in soiled sailor clothes, and all but me armed to the teeth. Silver had two guns slung about him, one before and one behind﻿—besides the great cutlass at his waist, and a pistol in each pocket of his square-tailed coat. To complete his strange appearance, Captain Flint sat perched upon his shoulder and gabbled odds and ends of purposeless sea-talk. I had a line about my waist, and followed obediently after the sea-cook, who held the loose end of the rope, now in his free hand, now between his powerful teeth. For all the world, I was led like a dancing bear."}, {"type": "image", "idx": 291, "alt": "Led Like a Dancing Bear", "src": "images/p291.webp"}, {"type": "text", "text": "The other men were variously burdened; some carrying picks and shovels﻿—for that had been the very first necessary they brought ashore from the *Hispaniola*﻿—others laden with pork, bread, and brandy for the midday meal. All the stores, I observed, came from our stock, and I could see the truth of Silver’s words the night before. Had he not struck a bargain with the doctor, he and his mutineers, deserted by the ship, must have been driven to subsist on clear water, and the proceeds of their hunting. Water would have been little to their taste; a sailor is not usually a good shot; and, besides all that, when they were so short of eatables, it was not likely they would be very flush of powder."}, {"type": "text", "text": "Well, thus equipped, we all set out﻿—even the fellow with the broken head, who should certainly have kept in shadow﻿—and straggled, one after another, to the beach, where the two gigs awaited us. Even these bore trace of the drunken folly of the pirates, one in a broken thwart, and both in their muddied and unbailed condition. Both were to be carried along with us, for the sake of safety; and so, with our numbers divided between them, we set forth upon the bosom of the anchorage."}, {"type": "image", "idx": 292, "alt": "Setting Out in the Gigs", "src": "images/p292.webp"}, {"type": "text", "text": "As we pulled over, there was some discussion on the chart. The red cross was, of course, far too large to be a guide; and the terms of the note on the back, as you will hear, admitted of some ambiguity. They ran, the reader may remember, thus:\n\n> “Tall tree, Spy-glass shoulder, bearing a point to the N. of N. N. E.\n\n> “Skeleton Island E. S. E. and by E.\n\n> “Ten feet.”\n\nA tall tree was thus the principal mark. Now, right before us, the anchorage was bounded by a plateau from two to three hundred feet high, adjoining on the north the sloping southern shoulder of the Spy-glass, and rising again toward the south into the rough, cliffy eminence called the Mizzenmast Hill. The top of the plateau was dotted thickly with pine trees of varying height. Every here and there, one of a different species rose forty or fifty feet clear above its neighbors, and which of these was the particular “tall tree” of Captain Flint could only be decided on the spot, and by the readings of the compass.\n\nYet, although that was the case, every man on board the boats had picked a favorite of his own ere we were halfway over, Long John alone shrugging his shoulders and bidding them wait till they were there."}, {"type": "text", "text": "We pulled easily, by Silver’s directions, not to weary the hands prematurely; and, after quite a long passage, landed at the mouth of the second river﻿—that which runs down a woody cleft of the Spy-glass. Thence, bending to our left, we began to ascend the slope towards the plateau.\n\nAt the first outset, heavy, miry ground and a matted, marsh vegetation greatly delayed our progress; but by little and little the hill began to steepen and become stony under foot, and the wood to change its character and to grow in a more open order. It was, indeed, a most pleasant portion of the island that we were now approaching. A heavy-scented broom and many flowering shrubs had almost taken the place of grass. Thickets of green nutmeg-trees were dotted here and there with the red columns and the broad shadow of the pines, and the first mingled their spice with the aroma of the others. The air, besides, was fresh and stirring, and this, under the sheer sunbeams, was a wonderful refreshment to our senses.\n\nThe party spread itself abroad, in a fan shape, shouting and leaping to and fro. About the center, and a good way behind the rest, Silver and I followed﻿—I tethered by my rope, he plowing, with deep pants, among the sliding gravel. From time to time, indeed, I had to lend him a hand, or he must have missed his footing and fallen backward down the hill."}, {"type": "image", "idx": 293, "alt": "Ascending the Slope", "src": "images/p293.webp"}, {"type": "text", "text": "We had thus proceeded for about half a mile, and were approaching the brow of the plateau, when the man upon the farthest left began to cry aloud, as if in terror. Shout after shout came from him, and the others began to run in his direction."}, {"type": "image", "idx": 294, "alt": "A Cry of Terror", "src": "images/p294.webp"}, {"type": "text", "text": "“He can’t ’a’ found the treasure,” said old Morgan, hurrying past us from the right, “for that’s clean atop.”\n\nIndeed, as we found when we also reached the spot, it was something very different. At the foot of a pretty big pine, and involved in a green creeper, which had even partly lifted some of the smaller bones, a human skeleton lay, with a few shreds of clothing, on the ground. I believe a chill struck for a moment to every heart."}, {"type": "text", "text": "“He was a seaman,” said George Merry, who, bolder than the rest, had gone up close, and was examining the rags of clothing. “Leastways, this is good sea-cloth.”\n\n“Ay, ay,” said Silver, “like enough; you wouldn’t look to find a bishop here, I reckon. But what sort of a way is that for bones to lie? ’Tain’t in natur’.”\n\nIndeed, on a second glance, it seemed impossible to fancy that the body was in a natural position. But for some disarray (the work, perhaps, of the birds that had fed upon him, or of the slow-growing creeper that had gradually enveloped his remains) the man lay perfectly straight﻿—his feet pointing in one direction, his hands raised above his head like a diver’s, pointing directly in the opposite.\n\n“I’ve taken a notion into my old numskull,” observed Silver. “Here’s the compass; there’s the tip-top p’int of Skeleton Island, stickin’ out like a tooth. Just take a bearing, will you, along the line of them bones.”\n\nIt was done. The body pointed straight in the direction of the island, and the compass read duly E. S. E. by E."}, {"type": "image", "idx": 295, "alt": "The Skeleton under the Pine", "src": "images/p295.webp"}, {"type": "text", "text": "“I thought so,” cried the cook; “this here is a p’inter. Right up there is our line for the Pole Star and the jolly dollars. But, by thunder! if it don’t make me cold inside to think of Flint. This is one of *his* jokes, and no mistake. Him and these six was alone here; he killed ’em, every man; and this one he hauled here and laid down by compass, shiver my timbers! They’re long bones, and the hair’s been yellow. Ay, that would be Allardyce. You mind Allardyce, Tom Morgan?”\n\n“Ay, ay,” returned Morgan, “I mind him; he owed me money, he did, and took my knife ashore with him.”\n\n“Speaking of knives,” said another, “why don’t we find his’n lying round? Flint warn’t the man to pick a seaman’s pocket; and the birds, I guess, would leave it be.”\n\n“By the powers and that’s true!” cried Silver.\n\n“There ain’t a thing left here,” said Merry, still feeling round among the bones; “not a copper doit nor a baccy box. It don’t look nat’ral to me.”\n\n“No, by gum, it don’t,” agreed Silver; “not nat’ral, nor not nice, says you. Great guns, messmates, but if Flint was living this would be a hot spot for you and me! Six they were, and six are we; and bones is what they are now.”"}, {"type": "image", "idx": 296, "alt": "Flint's Compass Pointer", "src": "images/p296.webp"}, {"type": "text", "text": "“I saw him dead with these here deadlights,” said Morgan. “Billy took me in. There he laid, with penny-pieces on his eyes.”\n\n“Dead﻿—ay, sure enough he’s dead and gone below,” said the fellow with the bandage; “but if ever sperrit walked it would be Flint’s. Dear heart, but he died bad, did Flint!”\n\n“Ay, that he did,” observed another; “now he raged and now he hollered for the rum, and now he sang. ‘Fifteen Men’ were his only song, mates; and I tell you true, I never rightly liked to hear it since. It was main hot and the windy was open, and I hear that old song comin’ out as clear as clear﻿—and the death-haul on the man already.”\n\n“Come, come,” said Silver, “stow this talk. He’s dead, and he don’t walk, that I know; leastways he won’t walk by day, and you may lay to that. Care killed a cat. Fetch ahead for the doubloons.”\n\nWe started, certainly, but in spite of the hot sun and the staring daylight, the pirates no longer ran separate and shouting through the wood, but kept side by side and spoke with bated breath. The terror of the dead buccaneer had fallen on their spirits."}, {"type": "image", "idx": 297, "alt": "The Shadow of Flint", "src": "images/p297.webp"}]}, {"title": "XXXII: The Treasure-Hunt—The Voice Among the Trees", "nodes": [{"type": "text", "text": "### XXXII\n\nThe Treasure-Hunt﻿—The Voice Among the Trees\n\nPartly from the damping influence of this alarm, partly to rest Silver and the sick folk, the whole party sat down as soon as they had gained the brow of the ascent.\n\nThe plateau being somewhat tilted toward the west, this spot on which we had paused commanded a wide prospect on either hand. Before us, over the treetops, we beheld the Cape of the Woods fringed with surf; behind, we not only looked down upon the anchorage and Skeleton Island, but saw﻿—clear across the spit and the eastern lowlands﻿—a great field of open sea upon the east. Sheer above us rose the Spy-glass, here dotted with single pines, there black with precipices. There was no sound but that of the distant breakers mounting from all around, and the chirp of countless insects in the brush. Not a man, not a sail upon the sea; the very largeness of the view increased the sense of solitude.\n\nSilver, as he sat, took certain bearings with his compass."}, {"type": "image", "idx": 298, "alt": "Resting on the Plateau", "src": "images/p298.webp"}, {"type": "text", "text": "“There are three ‘tall trees,’ ” said he, “about in the right line from Skeleton Island. ‘Spy-glass Shoulder,’ I take it, means that lower p’int there. It’s child’s play to find the stuff now. I’ve half a mind to dine first.”\n\n“I don’t feel sharp,” growled Morgan. “Thinkin’ o’ Flint﻿—I think it were﻿—as done me.”\n\n“Ah, well, my son, you praise your stars he’s dead,” said Silver.\n\n“He was an ugly devil,” cried a third pirate, with a shudder; “that blue in the face, too!”\n\n“That was how the rum took him,” added Merry. “Blue! well I reckon he was blue. That’s a true word.”"}, {"type": "text", "text": "Ever since they had found the skeleton and got upon this train of thought, they had spoken lower and lower, and they had almost got to whispering by now, so that the sound of their talk hardly interrupted the silence of the wood. All of a sudden, out of the middle of the trees in front of us, a thin, high, trembling voice struck up the well-known air and words:\n\n> “Fifteen men on the dead man’s chest, \\\n> Yo-ho-ho and a bottle of rum!”\n\nI never have seen men more dreadfully affected than the pirates."}, {"type": "image", "idx": 299, "alt": "The Ghostly Voice", "src": "images/p299.webp"}, {"type": "text", "text": "The color went from their six faces like enchantment; some leaped to their feet, some clawed hold of others; Morgan groveled on the ground.\n\n“It’s Flint, by —﻿—﻿—!” cried Merry."}, {"type": "text", "text": "The song had stopped as suddenly as it began﻿—broken off, you would have said, in the middle of a note, as though someone had laid his hand upon the singer’s mouth. Coming so far through the clear, sunny atmosphere among the green treetops, I thought it had sounded airily and sweetly, and the effect on my companions was the stranger.\n\n“Come,” said Silver, struggling with his ashen lips to get the word out, “that won’t do. Stand by to go about. This is a rum start, and I can’t name the voice, but it’s someone skylarking﻿—someone that’s flesh and blood, and you may lay to that.”\n\nHis courage had come back as he spoke, and some of the color to his face along with it. Already the others had begun to lend an ear to this encouragement, and were coming a little to themselves, when the same voice broke out again﻿—not this time singing, but in a faint, distant hail, that echoed yet fainter among the clefts of the Spy-glass.\n\n“Darby M’Graw,” it wailed﻿—for that is the word that best describes the sound﻿—“Darby M’Graw! Darby M’Graw!” again and again and again; and then rising a little higher, and with an oath that I leave out: “Fetch aft the rum, Darby!”"}, {"type": "image", "idx": 300, "alt": "Darby M'Graw", "src": "images/p300.webp"}, {"type": "text", "text": "The buccaneers remained rooted to the ground, their eyes starting from their heads. Long after the voice had died away they still stared in silence, dreadfully, before them.\n\n“That fixes it!” gasped one. “Let’s go.”\n\n“They was his last words,” moaned Morgan, “his last words aboveboard.”\n\nDick had his Bible out and was praying volubly. He had been well brought up, had Dick, before he came to sea and fell among bad companions.\n\nStill, Silver was unconquered. I could hear his teeth rattle in his head, but he had not yet surrendered.\n\n“Nobody in this here island ever heard of Darby,” he muttered; “not one but us that’s here.” And then, making a great effort: “Shipmates,” he cried, “I’m here to get that stuff, and I’ll not be beat by man nor devil. I never was feared of Flint in his life, and, by the powers, I’ll face him dead. There’s seven hundred thousand pound not a quarter of a mile from here. When did ever a gentleman o’ fortune show his stern to that much dollars for a boozy old seaman with a blue mug﻿—and him dead, too?”\n\nBut there was no sign of reawakening courage in his followers; rather, indeed, of growing terror at the irreverence of his words.\n\n“Belay there, John!” said Merry. “Don’t you cross a sperrit.”\n\nAnd the rest were all too terrified to reply. They would have run away severally had they dared, but fear kept them together, and kept them close by John, as if his daring helped them. He, on his part, had pretty well fought his weakness down.\n\n“Sperrit? Well, maybe,” he said. “But there’s one thing not clear to me. There was an echo. Now, no man ever seen a sperrit with a shadow. Well, then, what’s he doing with an echo to him, I should like to know? That ain’t in natur’, surely.”\n\nThis argument seemed weak enough to me."}, {"type": "image", "idx": 301, "alt": "Silver Stands Firm", "src": "images/p301.webp"}, {"type": "text", "text": "But you can never tell what will affect the superstitious, and, to my wonder, George Merry was greatly relieved.\n\n“Well, that’s so,” he said. “You’ve a head upon your shoulders, John, and no mistake. ’Bout ship, mates! This here crew is on a wrong tack, I do believe. And come to think on it, it was like Flint’s voice, I grant you, but not just so clear away like it, after all. It was liker somebody else’s voice now﻿—it was liker﻿—”\n\n“By the powers, Ben Gunn!” roared Silver.\n\n“Ay, and so it were,” cried Morgan, springing on his knees. “Ben Gunn it were!”"}, {"type": "image", "idx": 302, "alt": "It's Only Ben Gunn", "src": "images/p302.webp"}, {"type": "text", "text": "“It don’t make much odds, do it, now?” asked Dick. “Ben Gunn’s not here in the body, any more’n Flint.”\n\nBut the older hands greeted this remark with scorn.\n\n“Why, nobody minds Ben Gunn,” cried Merry; “dead or alive, nobody minds him!”"}, {"type": "text", "text": "It was extraordinary how their spirits had returned, and how the natural color had revived in their faces. Soon they were chatting together, with intervals of listening; and not long after, hearing no further sound, they shouldered the tools and set forth again, Merry walking first with Silver’s compass to keep them on the right line with Skeleton Island. He had said the truth; dead or alive, nobody minded Ben Gunn.\n\nDick alone still held his Bible, and looked around him as he went, with fearful glances; but he found no sympathy, and Silver even joked him on his precautions.\n\n“I told you,” said he, “I told you you had sp’iled your Bible. If it ain’t no good to swear by, what do you suppose a sperrit would give for it? Not that!” and he snapped his big fingers, halting a moment on his crutch."}, {"type": "image", "idx": 303, "alt": "Marching Onward", "src": "images/p303.webp"}, {"type": "text", "text": "But Dick was not to be comforted; indeed, it was soon plain to me that the lad was falling sick; hastened by heat, exhaustion, and the shock of his alarm, the fever, predicted by Doctor Livesey, was evidently growing swiftly higher."}, {"type": "text", "text": "It was fine open walking here, upon the summit; our way lay a little downhill, for, as I have said, the plateau tilted toward the west. The pines, great and small, grew wide apart; and even between the clumps of nutmeg and azalea, wide open spaces baked in the hot sunshine. Striking, as we did, pretty near northwest across the island, we drew, on the one hand, ever nearer under the shoulders of the Spy-glass, and on the other, looked ever wider over that western bay where I had once tossed and trembled in the coracle.\n\nThe first of the tall trees was reached, and by the bearing, proved the wrong one. So with the second. The third rose nearly two hundred feet into the air above a clump of underwood; a giant of a vegetable, with a red column as big as a cottage, and a wide shadow around in which a company could have maneuvered. It was conspicuous far to sea, both on the east and west, and might have been entered as a sailing mark upon the chart."}, {"type": "image", "idx": 304, "alt": "The Giant Pine", "src": "images/p304.webp"}, {"type": "text", "text": "But it was not its size that now impressed my companions; it was the knowledge that seven hundred thousand pounds in gold lay somewhere buried below its spreading shadow. The thought of the money, as they drew nearer, swallowed up their previous terrors. Their eyes burned in their heads; their feet grew speedier and lighter; their whole soul was bound up in that fortune, that whole lifetime of extravagance and pleasure, that lay waiting there for each of them.\n\nSilver hobbled, grunting, on his crutch; his nostrils stood out and quivered; he cursed like a madman when the flies settled on his hot and shiny countenance; he plucked furiously at the line that held me to him, and, from time to time, turned his eyes upon me with a deadly look."}, {"type": "image", "idx": 305, "alt": "Gold Fever", "src": "images/p305.webp"}, {"type": "text", "text": "Certainly he took no pains to hide his thoughts; and certainly I read them like print. In the immediate nearness of the gold, all else had been forgotten; his promise and the doctor’s warning were both things of the past; and I could not doubt that he hoped to seize upon the treasure, find and board the *Hispaniola* under cover of night, cut every honest throat about that island, and sail away as he had at first intended, laden with crimes and riches."}, {"type": "text", "text": "Shaken as I was with these alarms, it was hard for me to keep up with the rapid pace of the treasure-hunters. Now and again I stumbled, and it was then that Silver plucked so roughly at the rope and launched at me his murderous glances. Dick, who had dropped behind us, and now brought up the rear, was babbling to himself both prayers and curses, as his fever kept rising. This also added to my wretchedness, and, to crown all, I was haunted by the thought of the tragedy that had once been acted on that plateau, when that ungodly buccaneer with the blue face﻿—he who had died at Savannah, singing and shouting for drink﻿—had there, with his own hand, cut down his six accomplices. This grove, that was now so peaceful, must then have rung with cries, I thought; and even with the thought I could believe I heard it ringing still.\n\nWe were now at the margin of the thicket.\n\n“Huzza, mates, altogether!” shouted Merry, and the foremost broke into a run.\n\nAnd suddenly, not ten yards farther, we beheld them stop. A low cry arose."}, {"type": "image", "idx": 306, "alt": "The Sudden Halt", "src": "images/p306.webp"}, {"type": "text", "text": "Silver doubled his pace, digging away with the foot of his crutch like one possessed, and next moment he and I had come also to a dead halt."}, {"type": "text", "text": "Before us was a great excavation, not very recent, for the sides had fallen in and grass had sprouted on the bottom. In this were the shaft of a pick broken in two and the boards of several packing cases strewn around. On one of these boards I saw branded with a hot iron, the name *Walrus*﻿—the name of Flint’s ship.\n\nAll was clear to probation. The cache had been found and rifled﻿—the seven hundred thousand pounds were gone!"}, {"type": "image", "idx": 307, "alt": "The Empty Pit", "src": "images/p307.webp"}]}, {"title": "XXXIII: The Fall of a Chieftain", "nodes": [{"type": "text", "text": "### XXXIII\n\nThe Fall of a Chieftain\n\nThere never was such an overturn in this world. Each of these six men was as though he had been struck. But with Silver the blow passed almost instantly. Every thought of his soul had been set full-stretch, like a racer, on that money; well, he was brought up in a single second, dead; and he kept his head, found his temper, and changed his plan before the others had had time to realize the disappointment.\n\n“Jim,” he whispered, “take that, and stand by for trouble.”\n\nAnd he passed me a double-barreled pistol."}, {"type": "image", "idx": 308, "alt": "A Secret Alliance", "src": "images/p308.webp"}, {"type": "text", "text": "At the same time he began quietly moving northward, and in a few steps had put the hollow between us two and the other five. Then he looked at me and nodded, as much as to say: “Here is a narrow corner,” as, indeed, I thought it was. His looks were now quite friendly, and I was so revolted at these constant changes that I could not forbear whispering: “So you’ve changed sides again.”"}, {"type": "text", "text": "There was no time left for him to answer in. The buccaneers, with oaths and cries, began to leap, one after another, into the pit, and to dig with their fingers, throwing the boards aside as they did so. Morgan found a piece of gold. He held it up with a perfect spout of oaths. It was a two-guinea piece, and it went from hand to hand among them for a quarter of a minute.\n\n“Two guineas!” roared Merry, shaking it at Silver."}, {"type": "image", "idx": 309, "alt": "The Two-Guinea Disappointment", "src": "images/p309.webp"}, {"type": "text", "text": "“That’s your seven hundred thousand pounds, is it? You’re the man for bargains, ain’t you? You’re him that never bungled nothing, you wooden-headed lubber!”\n\n“Dig away, boys,” said Silver, with the coolest insolence; “you’ll find some pignuts, and I shouldn’t wonder.”"}, {"type": "text", "text": "“Pignuts!” repeated Merry, in a scream. “Mates, do you hear that? I tell you now, that man there knew it all along. Look in the face of him, and you’ll see it wrote there.”\n\n“Ah, Merry,” remarked Silver, “standing for cap’n again? You’re a pushing lad, to be sure.”\n\nBut this time everyone was entirely in Merry’s favor. They began to scramble out of the excavation, darting furious glances behind them. One thing I observed, which looked well for us; they all got out upon the opposite side from Silver.\n\nWell, there we stood, two on one side, five on the other, the pit between us, and nobody screwed up high enough to offer the first blow. Silver never moved; he watched them, very upright on his crutch, and looked as cool as ever I saw him. He was brave, and no mistake.\n\nAt last, Merry seemed to think a speech might help matters.\n\n“Mates,” says he, “there’s two of them alone there; one’s the old cripple that brought us all here and blundered us down to this; the other’s that cub that I mean to have the heart of. Now, mates﻿—”\n\nHe was raising his arm and his voice, and plainly meant to lead a charge. But just then﻿—crack! crack! crack!﻿—three musket-shots flashed out of the thicket."}, {"type": "image", "idx": 310, "alt": "Ambush in the Thicket", "src": "images/p310.webp"}, {"type": "text", "text": "Merry tumbled headforemost into the excavation; the man with the bandage spun round like a teetotum, and fell all his length upon his side, where he lay dead, but still twitching; and the other three turned and ran for it with all their might."}, {"type": "text", "text": "Before you could wink Long John had fired two barrels of a pistol into the struggling Merry; and as the man rolled up his eyes at him in the last agony, “George,” said he, “I reckon I settled you.”\n\nAt the same moment the doctor, Gray, and Ben Gunn joined us, with smoking muskets, from among the nutmeg-trees."}, {"type": "image", "idx": 311, "alt": "Rescue Party Arrives", "src": "images/p311.webp"}, {"type": "text", "text": "“Forward!” cried the doctor. “Double quick, my lads. We must head ’em off the boats.”"}, {"type": "text", "text": "And we set off at a great pace, sometimes plunging through the bushes to the chest.\n\nI tell you, but Silver was anxious to keep up with us. The work that man went through, leaping on his crutch till the muscles of his chest were fit to burst, was work no sound man ever equaled; and so thinks the doctor."}, {"type": "image", "idx": 312, "alt": "The Chase", "src": "images/p312.webp"}, {"type": "text", "text": "As it was, he was already thirty yards behind us, and on the verge of strangling, when we reached the brow of the slope.\n\n“Doctor,” he hailed, “see there! no hurry!”\n\nSure enough there was no hurry. In a more open part of the plateau we could see the three survivors still running in the same direction as they had started, right for Mizzenmast Hill. We were already between them and the boats, and so we four sat down to breathe, while Long John, mopping his face, came slowly up with us."}, {"type": "text", "text": "“Thank ye kindly, doctor,” says he. “You came in in about the nick, I guess, for me and Hawkins. And so it’s you, Ben Gunn!” he added. “Well, you’re a nice one, to be sure.”\n\n“I’m Ben Gunn, I am,” replied the maroon, wriggling like an eel in his embarrassment."}, {"type": "image", "idx": 313, "alt": "Ben Gunn's Triumph", "src": "images/p313.webp"}, {"type": "text", "text": "“And,” he added, after a long pause, “how do, Mr. Silver! Pretty well, I thank ye, says you.”\n\n“Ben, Ben,” murmured Silver, “to think as you’ve done me!”\n\nThe doctor sent back Gray for one of the pickaxes deserted, in their flight, by the mutineers; and then as we proceeded leisurely downhill to where the boats were lying, related, in a few words, what had taken place. It was a story that profoundly interested Silver, and Ben Gunn, the half-idiot maroon, was the hero from beginning to end.\n\nBen, in his long, lonely wanderings about the island, had found the skeleton. It was he that had rifled it; he had found the treasure; he had dug it up (it was the haft of his pickax that lay broken in the excavation); he had carried it on his back, in many weary journeys, from the foot of the tall pine to a cave he had on the two-pointed hill at the northeast angle of the island, and there it had lain stored in safety since two months before the arrival of the *Hispaniola*."}, {"type": "text", "text": "When the doctor had wormed this secret from him, on the afternoon of the attack, and when, next morning, he saw the anchorage deserted, he had gone to Silver, given him the chart, which was now useless; given him the stores, for Ben Gunn’s cave was well supplied with goats’ meat salted by himself; given anything and everything to get a chance of moving in safety from the stockade to the two-pointed hill, there to be clear of malaria and keep a guard upon the money.\n\n“As for you, Jim,” he said, “it went against my heart, but I did what I thought best for those who had stood by their duty; and if you were not one of these, whose fault was it?”\n\nThat morning, finding that I was to be involved in the horrid disappointment he had prepared for the mutineers, he had run all the way to the cave, and, leaving squire to guard the captain, had taken Gray and the maroon, and started, making the diagonal across the island, to be at hand beside the pine. Soon, however, he saw that our party had the start of him; and Ben Gunn, being fleet of foot, had been dispatched in front to do his best alone. Then it had occurred to him to work upon the superstitions of his former shipmates; and he was so far successful that Gray and the doctor had come up and were already ambushed before the arrival of the treasure-hunters.\n\n“Ah,” said Silver, “it was fortunate for me that I had Hawkins here. You would have let old John be cut to bits, and never given it a thought, doctor.”\n\n“Not a thought,” replied Doctor Livesey, cheerily.\n\nAnd by this time we had reached the gigs. The doctor, with the pickax, demolished one of them, and then we all got aboard the other, and set out to go round by the sea for North Inlet.\n\nThis was a run of eight or nine miles. Silver, though he was almost killed already with fatigue, was set to an oar, like the rest of us, and we were soon skimming swiftly over a smooth sea."}, {"type": "image", "idx": 314, "alt": "Rowing the Gig", "src": "images/p314.webp"}, {"type": "text", "text": "Soon we passed out of the straits and doubled the southeast corner of the island, round which, four days ago, we had towed the *Hispaniola*."}, {"type": "text", "text": "As we passed the two-pointed hill we could see the black mouth of Ben Gunn’s cave, and a figure standing by it, leaning on a musket. It was the squire, and we waved a handkerchief and gave him three cheers, in which the voice of Silver joined as heartily as any.\n\nThree miles farther, just inside the mouth of North Inlet, what should we meet but the *Hispaniola*, cruising by herself!"}, {"type": "image", "idx": 315, "alt": "The Hispaniola Drifting", "src": "images/p315.webp"}, {"type": "text", "text": "The last flood had lifted her, and had there been much wind, or a strong tide current, as in the southern anchorage, we should never have found her more, or found her stranded beyond help. As it was, there was little amiss, beyond the wreck of the mainsail. Another anchor was got ready, and dropped in a fathom and a half of water. We all pulled round again to Rum Cove, the nearest point for Ben Gunn’s treasure-house; and then Gray, single-handed, returned with the gig to the *Hispaniola*, where he was to pass the night on guard."}, {"type": "text", "text": "A gentle slope ran up from the beach to the entrance of the cave. At the top, the squire met us. To me he was cordial and kind, saying nothing of my escapade, either in the way of blame or praise. At Silver’s polite salute he somewhat flushed.\n\n“John Silver,” he said, “you’re a prodigious villain and impostor﻿—a monstrous impostor, sir. I am told I am not to prosecute you. Well, then, I will not. But the dead men, sir, hang about your neck like millstones.”\n\n“Thank you kindly, sir,” replied Long John, again saluting.\n\n“I dare you to thank me!” cried the squire. “It is a gross dereliction of my duty. Stand back!”\n\nAnd thereupon we all entered the cave. It was a large, airy place, with a little spring and a pool of clear water, overhung with ferns. The floor was sand. Before a big fire lay Captain Smollett; and in a far corner, only duskily flickered over by the blaze, I beheld great heaps of coin and quadrilaterals built of bars of gold."}, {"type": "image", "idx": 316, "alt": "The Cave of Gold", "src": "images/p316.webp"}, {"type": "text", "text": "That was Flint’s treasure that we had come so far to seek, and that had cost already the lives of seventeen men from the *Hispaniola*. How many it had cost in the amassing, what blood and sorrow, what good ships scuttled on the deep, what brave men walking the plank blindfold, what shot of cannon, what shame and lies and cruelty, perhaps no man alive could tell. Yet there were still three upon that island﻿—Silver, and old Morgan, and Ben Gunn﻿—who had each taken his share in these crimes, as each had hoped in vain to share in the reward."}, {"type": "text", "text": "“Come in, Jim,” said the captain. “You’re a good boy in your line, Jim; but I don’t think you and me’ll go to sea again. You’re too much of the born favorite for me. Is that you, John Silver? What brings you here, man?”\n\n“Come back to my dooty, sir,” returned Silver.\n\n“Ah!” said the captain, and that was all he said.\n\nWhat a supper I had of it that night, with all my friends around me; and what a meal it was, with Ben Gunn’s salted goat, and some delicacies and a bottle of old wine from the *Hispaniola*. Never, I am sure, were people gayer or happier. And there was Silver, sitting back almost out of the firelight, but eating heartily, prompt to spring forward when anything was wanted, even joining quietly in our laughter﻿—the same bland, polite, obsequious seaman of the voyage out."}, {"type": "image", "idx": 317, "alt": "A Strange Feast", "src": "images/p317.webp"}]}, {"title": "XXXIV: And Last", "nodes": [{"type": "text", "text": "### XXXIV\n\nAnd Last\n\nThe next morning we fell early to work, for the transportation of this great mass of gold near a mile by land to the beach, and thence three miles by boat to the *Hispaniola*, was a considerable task for so small a number of workmen. The three fellows still abroad upon the island did not greatly trouble us; a single sentry on the shoulder of the hill was sufficient to insure us against any sudden onslaught, and we thought, besides, they had had more than enough of fighting.\n\nTherefore the work was pushed on briskly. Gray and Ben Gunn came and went with the boat, while the rest during their absences piled treasure on the beach."}, {"type": "image", "idx": 318, "alt": "Moving the Gold", "src": "images/p318.webp"}, {"type": "text", "text": "Two of the bars, slung in a rope’s end, made a good load for a grown man﻿—one that he was glad to walk slowly with. For my part, as I was not much use at carrying, I was kept busy all day in the cave, packing the minted money into bread-bags."}, {"type": "text", "text": "It was a strange collection, like Billy Bones’s hoard for the diversity of coinage, but so much larger and so much more varied that I think I never had more pleasure than in sorting them. English, French, Spanish, Portuguese, Georges, and Louises, doubloons and double guineas and moidores and sequins, the pictures of all the kings of Europe for the last hundred years, strange oriental pieces stamped with what looked like wisps of string or bits of spider’s web, round pieces and square pieces, and pieces bored through the middle, as if to wear them round your neck﻿—nearly every variety of money in the world must, I think, have found a place in that collection; and for number, I am sure they were like autumn leaves, so that my back ached with stooping and my fingers with sorting them out."}, {"type": "image", "idx": 319, "alt": "A World of Coins", "src": "images/p319.webp"}, {"type": "text", "text": "Day after day this work went on; by every evening a fortune had been stowed aboard, but there was another fortune waiting for the morrow; and all this time we heard nothing of the three surviving mutineers."}, {"type": "text", "text": "At last﻿—I think it was on the third night﻿—the doctor and I were strolling on the shoulder of the hill where it overlooks the lowlands of the isle, when, from out the thick darkness below, the wind brought us a noise between shrieking and singing. It was only a snatch that reached our ears, followed by the former silence.\n\n“Heaven forgive them,” said the doctor; “ ’tis the mutineers!”\n\n“All drunk, sir,” struck in the voice of Silver from behind us."}, {"type": "image", "idx": 320, "alt": "Voices in the Dark", "src": "images/p320.webp"}, {"type": "text", "text": "Silver, I should say, was allowed his entire liberty, and, in spite of daily rebuffs, seemed to regard himself once more as quite a privileged and friendly dependent. Indeed, it was remarkable how well he bore these slights, and with what unwearying politeness he kept at trying to ingratiate himself with all. Yet, I think, none treated him better than a dog, unless it was Ben Gunn, who was still terribly afraid of his old quartermaster, or myself, who had really something to thank him for; although for that matter, I suppose, I had reason to think even worse of him than
