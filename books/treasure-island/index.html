anybody else, for I had seen him meditating a fresh treachery upon the plateau. Accordingly, it was pretty gruffly that the doctor answered him.\n\n“Drunk or raving,” said he.\n\n“Right you were, sir,” replied Silver; “and precious little odds which, to you and me.”\n\n“I suppose you would hardly ask me to call you a humane man,” returned the doctor, with a sneer, “and so my feelings may surprise you, Master Silver. But if I were sure they were raving﻿—as I am morally certain one, at least, of them is down with fever﻿—I should leave this camp, and, at whatever risk to my own carcass, take them the assistance of my skill.”\n\n“Ask your pardon, sir, you would be very wrong,” quoth Silver. “You would lose your precious life, and you may lay to that. I’m on your side now, hand and glove; and I shouldn’t wish for to see the party weakened, let alone yourself, seeing as I know what I owes you. But these men down there, they couldn’t keep their word﻿—no, not supposing they wished to﻿—and what’s more, they couldn’t believe as you could.”\n\n“No,” said the doctor. “You’re the man to keep your word, we know that.”"}, {"type": "text", "text": "Well, that was about the last news we had of the three pirates. Only once we heard a gunshot a great way off, and supposed them to be hunting. A council was held and it was decided that we must desert them on the island﻿—to the huge glee, I must say, of Ben Gunn, and with the strong approval of Gray. We left a good stock of powder and shot, the bulk of the salt goat, a few medicines and some other necessaries, tools, clothing, a spare sail, a fathom or two of rope, and, by the particular desire of the doctor, a handsome present of tobacco.\n\nThat was about our last doing on the island. Before that we had got the treasure stowed and had shipped enough water and the remainder of the goat meat, in case of any distress; and at last, one fine morning, we weighed anchor, which was about all that we could manage, and stood out of North Inlet, the same colors flying that the captain had flown and fought under at the palisade."}, {"type": "image", "idx": 321, "alt": "Weighing Anchor", "src": "images/p321.webp"}, {"type": "text", "text": "The three fellows must have been watching us closer than we thought for, as we soon had proved. For, coming through the narrows we had to lie very near the southern point, and there we saw all three of them kneeling together on a spit of sand with their arms raised in supplication."}, {"type": "image", "idx": 322, "alt": "Left Behind", "src": "images/p322.webp"}, {"type": "text", "text": "It went to all our hearts, I think, to leave them in that wretched state, but we could not risk another mutiny, and to take them home for the gibbet would have been a cruel sort of kindness. The doctor hailed them and told them of the stores we had left, and where they were to find them, but they continued to call us by name and appeal to us for God’s sake to be merciful and not leave them to die in such a place."}, {"type": "text", "text": "At last, seeing the ship still bore on her course, and was now swiftly drawing out of earshot, one of them﻿—I know not which it was﻿—leaped to his feet with a hoarse cry, whipped his musket to his shoulder, and sent a shot whistling over Silver’s head and through the mainsail."}, {"type": "image", "idx": 323, "alt": "A Final Shot", "src": "images/p323.webp"}, {"type": "text", "text": "After that we kept under cover of the bulwarks, and when next I looked out they had disappeared from the spit, and the spit itself had almost melted out of sight in the growing distance. That was, at least, the end of that; and before noon, to my inexpressible joy, the highest rock of Treasure Island had sunk into the blue round of sea."}, {"type": "text", "text": "We were so short of men that everyone on board had to bear a hand﻿—only the captain lying on a mattress in the stern and giving his orders, for though greatly recovered he was still in want of quiet. We laid her head for the nearest port in Spanish America, for we could not risk the voyage home without fresh hands; and as it was, what with baffling winds and a couple of fresh gales, we were all worn out before we reached it.\n\nIt was just at sundown when we cast anchor in a most beautiful landlocked gulf, and were immediately surrounded by shore boats full of negroes and Mexican Indians and half-bloods, selling fruits and vegetables, and offering to dive for bits of money. The sight of so many goodhumored faces (especially the blacks), the taste of the tropical fruits, and above all, the lights that began to shine in the town, made a most charming contrast to our dark and bloody sojourn on the island; and the doctor and the squire, taking me along with them, went ashore to pass the early part of the night."}, {"type": "image", "idx": 324, "alt": "A Beautiful Harbor", "src": "images/p324.webp"}, {"type": "text", "text": "Here they met the captain of an English man-of-war, fell in talk with him, went on board his ship, and in short, had so agreeable a time that day was breaking when we came alongside the *Hispaniola*."}, {"type": "text", "text": "Ben Gunn was on deck alone, and as soon as we came on board he began, with wonderful contortions, to make us a confession. Silver was gone. The maroon had connived at his escape in a shore boat some hours ago, and he now assured us he had only done so to preserve our lives, which would certainly have been forfeited if “that man with the one leg had stayed aboard.”"}, {"type": "image", "idx": 325, "alt": "Silver's Escape", "src": "images/p325.webp"}, {"type": "text", "text": "But this was not all. The sea-cook had not gone empty-handed. He had cut through a bulkhead unobserved, and had removed one of the sacks of coin, worth, perhaps, three or four hundred guineas, to help him on his further wanderings.\n\nI think we were all pleased to be so cheaply quit of him."}, {"type": "text", "text": "Well, to make a long story short, we got a few hands on board, made a good cruise home, and the *Hispaniola* reached Bristol just as Mr. Blandly was beginning to think of fitting out her consort. Five men only of those who had sailed returned with her. “Drink and the devil had done for the rest” with a vengeance, although, to be sure, we were not quite in so bad a case as that other ship they sang about:\n\n> “With one man of the crew alive, \\\n> What put to sea with seventy-five.”\n\nAll of us had an ample share of the treasure, and used it wisely or foolishly, according to our natures. Captain Smollett is now retired from the sea. Gray not only saved his money, but, being suddenly smit with the desire to rise, also studied his profession, and he is now mate and part owner of a fine full-rigged ship; married besides, and the father of a family. As for Ben Gunn, he got a thousand pounds, which he spent or lost in three weeks, or, to be more exact, in nineteen days, for he was back begging on the twentieth. Then he was given a lodge to keep, exactly as he had feared upon the island; and he still lives, a great favorite, though something of a butt with the country boys, and a notable singer in church on Sundays and saints’ days.\n\nOf Silver we have heard no more. That formidable seafaring man with one leg has at last gone clean out of my life, but I dare say he met his old negress, and perhaps still lives in comfort with her and Captain Flint. It is to be hoped so, I suppose, for his chances of comfort in another world are very small.\n\nThe bar silver and the arms still lie, for all that I know, where Flint buried them; and certainly they shall lie there for me. Oxen and wain-ropes would not bring me back again to that accursed island, and the worst dreams that ever I have are when I hear the surf booming about its coasts, or start upright in bed, with the sharp voice of Captain Flint still ringing in my ears: “Pieces of eight!"}, {"type": "image", "idx": 326, "alt": "Dreams of Treasure Island", "src": "images/p326.webp"}, {"type": "text", "text": "pieces of eight!”"}]}]};</script>
<script>// Story markup -> HTML, in the browser. The twin of pipeline/markup.py's
// `to_html`; both readers and the static export use it, so a book reads the same
// everywhere. Keep the two in step -- the format is described in markup.py:
//
//   *italic*  **bold**  `code`      inline
//   # ... ###### heading            (whole line)
//   > quoted line                   (line prefix)
//   ---                             scene divider (line alone)
//   trailing backslash              hard line break (verse, letters)
//   blank line                      block break
//   \*                              a literal marker character from the book
//
// Text that predates the markup (or came from a PDF) has no markers and renders
// exactly as it always did: one <p> per blank-line-separated block.
window.Markup = (function () {
  const SENTINEL = "\u0000";
  const SPECIAL = "\\*`#>-";
  const CODE = {}, DECODE = {};
  [...SPECIAL].forEach((c, i) => { const k = String.fromCharCode(97 + i); CODE[c] = k; DECODE[k] = c; });

  const HEADING = /^(#{1,6})\s+(.*)$/;
  const QUOTE = /^\s*>\s?/;

  function esc(s) {
    return (s || "").replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  // an escaped character leaves the stream entirely while we render, so it can
  // never take part in a marker match
  const protect = s => s.replace(/\\([\\*`#>-])/g, (_, c) => SENTINEL + CODE[c]);
  const restore = s => s.replace(new RegExp(SENTINEL + "(.)", "g"), (_, c) => DECODE[c] || c);

  function inline(s) {
    s = protect(esc(s));
    s = s.replace(/`([^`\n]+)`/g, "<code>$1</code>");
    // (no lookbehind: still unsupported on older iPad Safari, and a SyntaxError
    // here would take the whole reader down)
    s = s.replace(/\*\*\*(\S|\S.*?\S)\*\*\*/g, "<strong><em>$1</em></strong>");
    s = s.replace(/\*\*(\S|\S.*?\S)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/\*(\S|\S[^*\n]*?\S)\*/g, "<em>$1</em>");
    // a marker nothing could pair with is junk (source markup that interleaves runs,
    // or a slice cut mid-run); literal ones from the book are escaped, and escapes
    // are held aside until restore(), so this only ever drops our own
    s = s.replace(/[*`]/g, "");
    return restore(s);
  }

  // A bare newline is only how the source wrapped its text (PDF extraction and
  // every book stored before this format wrap mid-sentence), so it rejoins with a
  // space; a break the book asked for is marked with a trailing backslash -- an
  // ODD number of them, since a literal backslash from the book is stored doubled.
  const breaks = l => (l.length - l.replace(/\\+$/, "").length) % 2 === 1;

  // The whole block goes through inline() in ONE pass, with breaks held as a
  // placeholder rather than a newline, so an emphasis run covering several lines
  // of a verse renders as emphasis instead of stray asterisks.
  const BREAK = "\u0001";

  function linesHtml(lines) {
    const parts = [];
    lines.forEach((line, i) => {
      let l = line.trim();
      const hard = breaks(l);
      if (hard) l = l.slice(0, -1).replace(/\s+$/, "");
      parts.push(l);
      if (i < lines.length - 1) parts.push(hard ? BREAK : " ");
    });
    return inline(parts.join("")).split(BREAK).join("<br>");
  }

  function blocks(text) {
    return (text || "").split(/\n\s*\n/)
      .map(b => b.split("\n").filter(l => l.trim()))
      .filter(b => b.length);
  }

  // Render story markup as HTML. `firstClass` (optional) goes on the first
  // paragraph, for readers that suppress that one's indent.
  function toHtml(text, firstClass) {
    const out = [];
    let quoted = [], first = true;
    const closeQuote = () => {
      if (quoted.length) { out.push("<blockquote>" + quoted.join("") + "</blockquote>"); quoted = []; }
    };
    for (const lines of blocks(text)) {
      if (lines.every(l => QUOTE.test(l))) {         // consecutive quoted blocks
        quoted.push("<p>" + linesHtml(lines.map(l => l.replace(QUOTE, ""))) + "</p>");
        continue;
      }
      closeQuote();
      const head = lines.length === 1 ? lines[0].match(HEADING) : null;
      if (head) {
        const level = Math.max(2, Math.min(6, head[1].length));
        out.push(`<h${level}>${inline(head[2])}</h${level}>`);
        continue;
      }
      if (lines.length === 1 && lines[0].trim() === "---") { out.push('<hr class="scene">'); continue; }
      const cls = first && firstClass ? ` class="${firstClass}"` : "";
      out.push(`<p${cls}>${linesHtml(lines)}</p>`);
      first = false;
    }
    closeQuote();
    return out.join("");
  }

  // Markup removed -- for anywhere plain text is wanted (alt text, titles).
  function plain(text) {
    return blocks(text)
      .filter(lines => !(lines.length === 1 && lines[0].trim() === "---"))
      .map(lines => lines
        .map(l => { const t = l.trim(); return breaks(t) ? t.slice(0, -1).trim() : t; })
        .map(l => restore(protect(l).replace(/^(#{1,6})\s+/, "").replace(QUOTE, "").replace(/[*`]/g, "")).trim())
        .filter(Boolean).join("\n"))
      .join("\n\n");
  }

  return { toHtml, plain, esc };
})();
</script>
<script>
// ─────────────────────────────────────────────────────────────────────────────
//  INTRO — the welcome screen shown when the viewer first opens. EDIT FREELY.
//  • heading    : the title at the top of the card
//  • paragraphs : one string per paragraph (plain text, add/remove as you like).
//                 These tokens are filled in automatically per book:
//                   {title}    → this book's title (rendered in italics)
//                   {style}    → this book's art style (rendered in “quotes”)
//                   {project}  → a link using `github` below
//  • github     : the link {project} turns into (url + visible label)
//  • button     : the label on the dismiss button
//  • show       : set to false to skip the intro entirely
// ─────────────────────────────────────────────────────────────────────────────
const INTRO = {
  show: true,
  heading: "About this demo",
  paragraphs: [
    "This is an AI-illustrated version of {title} rendered in the artistic style of {style}. It's a demo of what can be created with {project}. It creates consistent images across a full story, with (mostly) the same characters and settings used across the pages.",
    "I've found that my young children will pay attention to more sophisticated stories if they're accompanied by color illustrations. I've had great luck reading to them so far and hope you enjoy it too. Of course these images are nowhere near the quality and consistency of a real human artist and I'd encourage you to look for those first.",
  ],
  github: { url: "https://github.com/achatham/storyteller-app", label: "this project" },
  button: "Begin reading",
};

const BOOK = window.BOOK || {title:"", chapters:[]};
const $ = s => document.querySelector(s);
const LKEY = "export:" + (BOOK.title || "book");
let CH = 0, page = 0, pages = 1, imgs = [];
const ANIM_KEY = "export:anim"; let animOn = true;
try { animOn = localStorage.getItem(ANIM_KEY) !== "0"; } catch(e){}
function applyAnim(){ document.body.classList.toggle("noanim", !animOn); if($("#animchk")) $("#animchk").checked = animOn; }
const FS_KEY = "export:fs"; let fontScale = 1;
try { fontScale = parseFloat(localStorage.getItem(FS_KEY)) || 1; } catch(e){}
function applyFont(){ document.documentElement.style.setProperty("--fs", fontScale);
  if ($("#fsval")) $("#fsval").textContent = Math.round(fontScale*100) + "%"; }
function setFont(d){ fontScale = Math.min(1.8, Math.max(0.7, Math.round((fontScale+d)*100)/100));
  try { localStorage.setItem(FS_KEY, fontScale); } catch(e){} applyFont();
  const frac = page/Math.max(1,pages); requestAnimationFrame(()=>{ paginate(); goPage(Math.round(frac*pages), true); }); }

function esc(s){ return (s||"").replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function boot(){
  if (!BOOK.chapters.length){ $("#splash").textContent = "Empty book."; return; }
  $("#bk").innerHTML = esc(BOOK.title) + (BOOK.author ? `<br><small>${esc(BOOK.author)}</small>` : "");
  document.title = BOOK.title || "Storyteller";
  $("#chap").innerHTML = BOOK.chapters.map((c,i) => `<option value="${i}">${esc(c.title)}</option>`).join("");
  let start = { ch:0, page:0 };
  try { const s = JSON.parse(localStorage.getItem(LKEY)); if (s) start = s; } catch(e){}
  $("#splash").hidden = true; applyAnim(); applyFont();
  showIntro();
  loadChapter(Math.min(start.ch||0, BOOK.chapters.length-1), start.page||0);
}

function fillIntro(t){
  const gh = INTRO.github || {};
  const link = gh.url
    ? `<a href="${esc(gh.url)}" target="_blank" rel="noopener">${esc(gh.label || gh.url)}</a>`
    : esc(gh.label || "");
  return esc(t)                                  // escape author text first, then fill tokens
    .split("{title}").join(`<em>${esc(BOOK.title || "")}</em>`)
    .split("{style}").join(`“${esc(BOOK.style || "")}”`)
    .split("{project}").join(link);
}
function showIntro(){
  if (!INTRO.show) return;
  $("#introhd").textContent = INTRO.heading || "";
  $("#introbody").innerHTML = (INTRO.paragraphs || []).map(t => `<p>${fillIntro(t)}</p>`).join("");
  $("#introbtn").textContent = INTRO.button || "Begin";
  $("#intro").hidden = false;
}
// true while any blocking overlay (intro or menu) is open — pauses page turns
function modalOpen(){ return !$("#intro").hidden || !$("#menu").hidden; }

function loadChapter(ci, toPage){
  CH = ci;
  const data = BOOK.chapters[ci];
  setX(0, false);
  const html = [`<h2 class="chtitle"><span class="ch">${esc(data.title)}</span></h2>`];
  for (const n of data.nodes){
    if (n.type === "text")
      html.push(Markup.toHtml(n.text));   // the book's own italics/headings/verse
    else
      html.push(`<figure><img alt="${esc(n.alt||"")}" src="${n.src}" onload="this.classList.add('on')"></figure>`);
  }
  $("#flow").innerHTML = html.join("");
  $("#chap").value = ci;
  imgs = [...$("#flow").querySelectorAll("img")];
  imgs.forEach(im => { if (im.complete && im.naturalWidth) im.classList.add("on"); });
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    paginate(); goPage(toPage === -1 ? pages-1 : Math.min(toPage||0, pages-1), true);
  }));
}

function stride(){ const f = $("#flow"); return f.clientWidth + (parseFloat(getComputedStyle(f).columnGap)||0); }
function paginate(){ const f = $("#flow");
  pages = Math.max(1, Math.ceil((f.scrollWidth + (parseFloat(getComputedStyle(f).columnGap)||0)) / stride())); }
function setX(px, animate){ const f = $("#flow");
  if (animate && animOn){ f.style.transition = ""; f.style.transform = `translateX(${px}px)`; }
  else { f.style.transition = "none"; f.style.transform = `translateX(${px}px)`; void f.offsetWidth; f.style.transition = ""; } }
function goPage(n, force){
  page = Math.max(0, Math.min(pages-1, n));
  setX(-page*stride(), !force);
  $("#bar").style.width = ((page+1)/pages*100) + "%";
  $("#pageno").textContent = `${(BOOK.chapters[CH]||{}).title||""} — ${page+1}/${pages}`;
  try { localStorage.setItem(LKEY, JSON.stringify({ch:CH, page})); } catch(e){}
}

function sweep(dir){ if (!animOn) return; const t = $("#turn"); t.classList.remove("fwd","back"); void t.offsetWidth; t.classList.add(dir); }
function next(){ if (page < pages-1){ sweep("fwd"); goPage(page+1); } else if (CH < BOOK.chapters.length-1) loadChapter(CH+1, 0); }
function prev(){ if (page > 0){ sweep("back"); goPage(page-1); } else if (CH > 0) loadChapter(CH-1, -1); }

let tx=null, ty=null, moved=false;
document.addEventListener("touchstart", e=>{ tx=e.touches[0].clientX; ty=e.touches[0].clientY; moved=false; }, {passive:true});
document.addEventListener("touchmove", e=>{ if(tx!==null && (Math.abs(e.touches[0].clientX-tx)>10||Math.abs(e.touches[0].clientY-ty)>10)) moved=true; }, {passive:true});
document.addEventListener("touchend", e=>{ if(tx===null) return; const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty; tx=null;
  if(modalOpen()) return;
  if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)){ moved=true; dx<0?next():prev(); } }, {passive:true});
document.addEventListener("click", e=>{
  if(moved){ moved=false; return; }
  if(modalOpen()) return;
  if(e.target.closest("#menuBtn,#menu")) return;
  (e.clientX/window.innerWidth < 0.5) ? prev() : next();
});
document.addEventListener("keydown", e=>{
  if(!$("#intro").hidden){ if(["Escape"," ","Enter"].includes(e.key)){ $("#intro").hidden=true; e.preventDefault(); } return; }
  if(e.key==="ArrowRight"||e.key===" "){ next(); e.preventDefault(); }
  if(e.key==="ArrowLeft") prev();
  if(e.key==="Escape") $("#menu").hidden=true;
});
$("#introbtn").onclick = e=>{ e.stopPropagation(); $("#intro").hidden=true; };
$("#menuBtn").onclick = e=>{ e.stopPropagation(); $("#menu").hidden=false; };
$("#menu").onclick = e=>{ if(e.target===$("#menu")) $("#menu").hidden=true; e.stopPropagation(); };
$("#close").onclick = e=>{ e.stopPropagation(); $("#menu").hidden=true; };
$("#chap").onchange = e=>{ $("#menu").hidden=true; loadChapter(+e.target.value, 0); };
$("#animchk").onchange = e=>{ animOn=e.target.checked; try{localStorage.setItem(ANIM_KEY, animOn?"1":"0");}catch(_){} applyAnim(); };
$("#fsdown").onclick = e=>{ e.stopPropagation(); setFont(-0.1); };
$("#fsup").onclick = e=>{ e.stopPropagation(); setFont(0.1); };
const fsEl = document.documentElement;
const inFS = ()=>document.fullscreenElement||document.webkitFullscreenElement;
$("#fs").onclick = e=>{ e.stopPropagation(); try{ inFS()?(document.exitFullscreen||document.webkitExitFullscreen).call(document):(fsEl.requestFullscreen||fsEl.webkitRequestFullscreen).call(fsEl);}catch(_){} };
let rt=null;
window.addEventListener("resize", ()=>{ clearTimeout(rt); rt=setTimeout(()=>{ const frac=page/Math.max(1,pages); paginate(); goPage(Math.round(frac*pages), true); }, 200); });
boot();
</script>
</body></html>
