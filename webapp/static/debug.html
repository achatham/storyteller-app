<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storyteller — generation debug</title>
<style>
  :root { --bg:#f4efe6; --ink:#2b2622; --muted:#9a8a70; --panel:#fffdf8; --line:#e0d4bd; --accent:#7a5c3e;
          --good:#3f7d4f; --mid:#b9892f; --bad:#b14b3a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,sans-serif; }
  header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
  header h1 { font-family:Georgia,serif; font-size:1.25rem; margin:0; }
  a { color:var(--accent); text-decoration:none; }
  .tabs { display:flex; gap:6px; margin-left:auto; }
  .tab { font-size:.85rem; padding:5px 14px; border:1px solid var(--line); border-radius:20px; background:var(--panel); cursor:pointer; color:var(--ink); }
  .tab.sel { background:var(--accent); color:#fff; border-color:var(--accent); }
  .wrap { display:grid; grid-template-columns:270px 1fr; min-height:calc(100vh - 53px); }
  .list { border-right:1px solid var(--line); overflow:auto; max-height:calc(100vh - 53px); }
  .pg { padding:9px 16px; border-bottom:1px solid var(--line); cursor:pointer; font-size:.86rem; }
  .pg:hover { background:#fbf6ec; } .pg.sel { background:#f1e7d3; }
  .pg .t { color:var(--muted); }
  .pg .meta { font-size:.74rem; color:var(--muted); margin-top:2px; }
  main { padding:18px 22px 60px; overflow:auto; max-height:calc(100vh - 53px); }
  .empty { color:var(--muted); padding:40px; font-style:italic; }
  .dhead { display:flex; align-items:center; gap:12px; margin:0 0 14px; flex-wrap:wrap; }
  .dhead h2 { font-size:1.05rem; margin:0; }
  .rbtn { font-size:.8rem; padding:6px 13px; border:1px solid var(--accent); border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; }
  .rbtn[disabled]{ opacity:.5; cursor:default; }
  .gen { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px 18px; margin-bottom:22px; }
  .gen > h3 { font-size:.95rem; margin:0 0 4px; }
  .brief { color:#5b5347; font-style:italic; margin:2px 0 10px; font-family:Georgia,serif; }
  .states { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
  .chip { font-size:.74rem; background:#f1e7d3; border:1px solid var(--line); border-radius:20px; padding:2px 9px; }
  .chip b { color:var(--accent); }
  .atts { display:flex; gap:16px; flex-wrap:wrap; }
  .att { width:300px; border:1px solid var(--line); border-radius:11px; overflow:hidden; background:#fff; }
  .att.kept { border-color:var(--good); box-shadow:0 0 0 2px rgba(63,125,79,.25); }
  .att img { width:100%; display:block; background:#eee; }
  .att .body { padding:10px 12px; }
  .badges { display:flex; gap:6px; align-items:center; margin-bottom:7px; }
  .badge { font-size:.7rem; text-transform:uppercase; letter-spacing:.4px; padding:2px 8px; border-radius:20px; border:1px solid var(--line); }
  .badge.fresh { background:#eef3f7; } .badge.revise { background:#f7eee9; }
  .badge.kept { background:var(--good); color:#fff; border-color:var(--good); }
  .scores { display:flex; gap:5px; margin-bottom:7px; flex-wrap:wrap; }
  .s { font-size:.72rem; padding:2px 7px; border-radius:6px; border:1px solid var(--line); }
  .s.good { background:#e8f2ea; color:var(--good); } .s.mid { background:#f7efdd; color:var(--mid); }
  .s.bad { background:#f6e6e2; color:var(--bad); }
  ul.iss { margin:6px 0; padding-left:18px; font-size:.8rem; color:#5b5347; }
  .fix { font-size:.8rem; background:#fbf3e6; border-left:3px solid var(--accent); padding:5px 9px; margin-top:7px; }
  details { margin-top:8px; } summary { cursor:pointer; font-size:.78rem; color:var(--accent); }
  .strip { display:flex; gap:8px; flex-wrap:wrap; margin:10px 0 14px; }
  .strip .pgimg { width:190px; }
  .strip .pgimg img { width:100%; display:block; border:1px solid var(--line); border-radius:8px; background:#eee; }
  .strip .pgimg .cap { font-size:.72rem; color:var(--muted); margin-top:3px; }
  .issue { font-size:.84rem; padding:6px 10px; border-left:3px solid var(--mid); background:#fbf6ec; margin:6px 0; }
  .issue.sev3 { border-color:var(--bad); } .issue.sev1 { border-color:var(--line); }
  .issue .rc { font-size:.7rem; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); margin-left:6px; }
  .prop { border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin:8px 0; background:#fff; font-size:.84rem; }
  .prop h4 { margin:0 0 4px; font-size:.9rem; }
  .prop .why { color:#5b5347; font-style:italic; }
  .pedit { border-top:1px solid var(--line); padding:8px 0; font-size:.84rem; }
  .pedit .badge.keep { background:#e8f2ea; } .pedit .badge.revise { background:#f7eee9; } .pedit .badge.regenerate { background:#f6e6e2; }
  .form { display:flex; gap:8px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; font-size:.82rem; }
  .form input { width:64px; padding:4px 6px; border:1px solid var(--line); border-radius:6px; font-size:.82rem; }
  pre { white-space:pre-wrap; word-break:break-word; font-size:.72rem; background:#faf6ee; border:1px solid var(--line);
        border-radius:8px; padding:9px; margin:6px 0 0; max-height:280px; overflow:auto; }
</style>
</head><body>
<header>
  <h1 id="title">Generation debug</h1>
  <a id="back" href="#">&#8592; Settings</a>
  <div class="tabs"><span class="tab" data-mode="pages">Page scenes</span><span class="tab" data-mode="sheets">Roster sheets</span><span class="tab" data-mode="flagged">⚑ Flagged</span><span class="tab" data-mode="continuity">Continuity</span></div>
</header>
<div class="wrap">
  <div class="list" id="list"></div>
  <main id="detail"><div class="empty">Pick an item on the left to see its generation history.</div></main>
</div>
<script>
const ID = __BOOK_ID__, INIT = __PAGE__;
const $ = s => document.querySelector(s);
const esc = s => (s||"").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
$("#back").href = "/settings/" + ID;
const sCls = v => v >= 4 ? "good" : v >= 3 ? "mid" : "bad";
const when = t => t ? new Date(t*1000).toLocaleString() : "";
let MODE = "pages", SEL = null;

function critBlock(c){
  if (!c) return `<div class="scores"><span class="s bad">critic skipped</span></div>`;
  const scores = Object.entries(c).filter(([k,v]) => typeof v === "number")
    .map(([k,v]) => `<span class="s ${sCls(v)}">${k.replace(/_/g," ")} ${v}</span>`).join("");
  const iss = (c.issues||[]).length ? `<ul class="iss">${c.issues.map(i=>`<li>${esc(i)}</li>`).join("")}</ul>` : "";
  const fix = c.fix_hint ? `<div class="fix"><b>fix →</b> ${esc(c.fix_hint)}</div>` : "";
  return `<div class="scores">${scores}</div>${iss}${fix}`;
}
function attCard(imgUrl, a, kept){
  const badges = `<div class="badges">${a.mode?`<span class="badge ${a.mode}">${a.mode}</span>`:""}`
    + `<span class="badge">#${a.attempt}</span>${kept?`<span class="badge kept">kept</span>`:""}`
    + `<span style="font-size:.72rem;color:var(--muted)">min ${a.min ?? "—"} · avg ${a.avg ?? "—"}</span></div>`;
  return `<div class="att ${kept?"kept":""}"><img loading="lazy" src="${imgUrl}">
    <div class="body">${badges}${critBlock(a.critique)}
    <details><summary>Prompt sent to image model</summary><pre>${esc(a.prompt)}</pre></details></div></div>`;
}

async function setMode(m){
  MODE = m; SEL = null;
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("sel", t.dataset.mode === m));
  const hint = m==="pages" ? "a page" : m==="sheets" ? "a roster sheet" : m==="continuity" ? "a review" : "a flagged item";
  $("#detail").innerHTML = `<div class="empty">Pick ${hint} on the left.</div>`;
  await loadList();
}

async function loadList(){
  const L = $("#list");
  if (MODE === "flagged"){
    const r = await (await fetch(`${API()}/debug/flagged`)).json();
    const items = [
      ...r.pages.map(p => ({sheet:false, key:`p${p.idx}`, label:`p${p.idx} ${p.title||""}`, score:p.score, issues:p.issues, go:()=>loadPage(p.idx)})),
      ...r.sheets.map(s => ({sheet:true, key:`${s.entity_id}/${s.variant_id}`, label:`${s.entity_id} · ${s.variant_id}`, score:s.score, issues:s.issues, go:()=>loadSheet(s.entity_id, s.variant_id)})),
    ];
    if (!items.length){ L.innerHTML = `<div class="empty">Nothing below the pass threshold (${r.threshold}) — every kept image cleared the critic. 🎉</div>`; return; }
    const bar = `<div style="padding:10px 16px;border-bottom:1px solid var(--line)">
      <button class="rbtn" id="redrawAll">Redraw all ${r.pages.length} flagged pages</button></div>`;
    L.innerHTML = bar + items.map((it,i) => `<div class="pg" data-i="${i}">
      <div><span class="s ${sCls(it.score)}">${it.score}</span> ${it.sheet?"🎭":"📄"} <span class="t">${esc(it.label)}</span></div>
      ${it.issues&&it.issues.length?`<div class="meta">${esc(it.issues[0])}</div>`:""}</div>`).join("");
    L.querySelectorAll(".pg").forEach((el,i) => el.onclick = items[i].go);
    if ($("#redrawAll")) $("#redrawAll").onclick = async () => {
      const b = $("#redrawAll");
      if (!confirm(`Redraw all ${r.pages.length} flagged pages? They regenerate in the background under the current loop (costs image generations).`)) return;
      b.disabled = true; b.textContent = "Redrawing in background…";
      await fetch(`${API()}/debug/redraw-flagged`, {method:"POST"});
      b.textContent = "Started — re-check the list in a few minutes";
    };
    return;
  }
  if (MODE === "continuity"){ await loadReviews(); return; }
  if (MODE === "pages"){
    const r = await (await fetch(`${API()}/debug/pages`)).json();
    if (!r.pages.length){ L.innerHTML = `<div class="empty">No page history yet. Read some pages, then return.</div>`; return; }
    L.innerHTML = r.pages.map(p => `<div class="pg" data-idx="${p.idx}">
      <div>p${p.idx} <span class="t">${esc(p.title)}</span></div>
      <div class="meta">${p.gens} gen${p.gens>1?"s":""} · ${p.attempts} attempts · best ${p.score ?? "—"}</div></div>`).join("");
    L.querySelectorAll(".pg").forEach(el => el.onclick = () => loadPage(+el.dataset.idx));
    if (INIT >= 0){ loadPage(INIT); }
  } else {
    const r = await (await fetch(`${API()}/debug/sheets`)).json();
    if (!r.sheets.length){ L.innerHTML = `<div class="empty">No sheet history yet. Redraw a sheet (button at top of its detail) or read pages that use it.</div>`; return; }
    L.innerHTML = r.sheets.map(s => `<div class="pg" data-eid="${esc(s.entity_id)}" data-vid="${esc(s.variant_id)}">
      <div>${esc(s.entity_id)} <span class="t">${esc(s.variant_id)}</span></div>
      <div class="meta">${s.gens} gen${s.gens>1?"s":""} · ${s.attempts} attempts · best ${s.score ?? "—"}</div></div>`).join("");
    L.querySelectorAll(".pg").forEach(el => el.onclick = () => loadSheet(el.dataset.eid, el.dataset.vid));
  }
}
const API = () => `/api/books/${ID}`;

async function loadPage(idx){
  SEL = {idx};
  document.querySelectorAll(".pg").forEach(e => e.classList.toggle("sel", +e.dataset.idx === idx));
  history.replaceState(null, "", `/debug/${ID}?page=${idx}`);
  const r = await (await fetch(`${API()}/pages/${idx}/history`)).json();
  renderHistory(`Page ${idx} — ${esc(r.title||"")}`, {page: idx},
    r.history, g => `${API()}/pages/${idx}/gen/${g.gen_id}/attempt`);
}

async function loadSheet(eid, vid){
  SEL = {eid, vid};
  document.querySelectorAll(".pg").forEach(e => e.classList.toggle("sel", e.dataset.eid===eid && e.dataset.vid===vid));
  const r = await (await fetch(`${API()}/sheet/${encodeURIComponent(eid)}/${encodeURIComponent(vid)}/history`)).json();
  renderHistory(`${esc(eid)} / ${esc(vid)}`,
    {eid, vid}, r.history, g => `${API()}/sheet/${encodeURIComponent(eid)}/${encodeURIComponent(vid)}/gen/${g.gen_id}/attempt`);
}

function renderHistory(titleHtml, target, hist, attBase){
  const D = $("#detail");
  const isPage = target && target.page !== undefined;
  const redraw = target ? `<button class="rbtn" id="redraw">Redraw this ${isPage?"page":"sheet"}</button>` : "";
  const head = `<div class="dhead"><h2>${titleHtml}</h2>${redraw}</div>`;
  if (!hist.length){
    D.innerHTML = head + `<div class="empty">No generation history${target?" — hit Redraw to generate one with a trace.":"."}</div>`;
  } else {
    D.innerHTML = head + hist.map(g => {
      const states = Object.entries(g.states||{}).map(([k,v]) => `<span class="chip"><b>${esc(k)}</b>: ${esc(v)}</span>`).join("");
      const atts = g.attempts.map(a => attCard(`${attBase(g)}/${a.attempt}/image`, a, a.attempt === g.chosen)).join("");
      return `<div class="gen"><h3>Generation #${g.gen_id} · kept attempt ${g.chosen} · final ${g.final_score ?? "—"}</h3>
        ${g.brief?`<div class="brief">${esc(g.brief)}</div>`:""}${g.descr?`<div class="brief">${esc(g.descr)}</div>`:""}
        <div class="meta" style="font-size:.74rem;color:var(--muted);margin-bottom:8px">${when(g.created_at)}</div>
        ${states?`<div class="states">${states}</div>`:""}<div class="atts">${atts}</div></div>`;
    }).join("");
  }
  if (target){
    $("#redraw").onclick = async () => {
      const b = $("#redraw"); b.disabled = true; b.textContent = "Redrawing…";
      if (isPage){
        await fetch(`${API()}/pages/${target.page}/redraw`, {method:"POST"});
        for (let i=0; i<60; i++){                       // poll the background render
          await new Promise(r => setTimeout(r, 3000));
          if ((await fetch(`${API()}/pages/${target.page}/image`, {cache:"no-store"})).ok) break;
        }
        await loadList(); await loadPage(target.page);
      } else {
        await fetch(`${API()}/sheet/${encodeURIComponent(target.eid)}/${encodeURIComponent(target.vid)}/redraw`, {method:"POST"});
        await loadList(); await loadSheet(target.eid, target.vid);
      }
    };
  }
}

// ---- continuity reviews: a critic reads 5 consecutive pages + text and recommends plan edits ----
let REVIEW_POLL = null;
async function loadReviews(){
  const L = $("#list");
  const r = await (await fetch(`${API()}/continuity`)).json();
  const form = `<div class="form">Review pages <input id="rvFrom" type="number" min="0" placeholder="from">–<input id="rvTo" type="number" min="0" placeholder="to">
    <button class="rbtn" id="rvRun" ${r.running?"disabled":""}>${r.running?"Reviewing…":"Run"}</button>
    <span style="color:var(--muted)">${r.running?"a review is running; windows appear as they finish":"5 pages per window; text-model only (cheap)"}</span></div>`;
  const rows = r.reviews.map(v => `<div class="pg" data-id="${v.id}">
    <div>p${v.start_idx}–${v.end_idx} ${v.applied_at?'<span class="badge kept">applied</span>':""}</div>
    <div class="meta">${v.n_issues} issues · ${v.n_edits} edits · +${v.n_new_entities} entities · +${v.n_new_variants} variants · ${when(v.created_at)}</div></div>`).join("");
  L.innerHTML = form + (rows || `<div class="empty">No reviews yet. Pick a page range and Run.</div>`);
  L.querySelectorAll(".pg").forEach(el => { el.onclick = () => loadReview(+el.dataset.id);
    if (SEL && SEL.review === +el.dataset.id) el.classList.add("sel"); });
  $("#rvRun").onclick = async () => {
    const start = +$("#rvFrom").value, end = +$("#rvTo").value;
    if (!(end >= start)) { alert("Give a page range, e.g. 382 to 391."); return; }
    $("#rvRun").disabled = true;
    const res = await (await fetch(`${API()}/continuity/review`, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({start, end})})).json();
    if (!res.ok) alert(res.error || "could not start");
    await loadReviews();
  };
  clearInterval(REVIEW_POLL);
  if (r.running) REVIEW_POLL = setInterval(async () => { if (MODE !== "continuity") { clearInterval(REVIEW_POLL); return; } await loadReviews(); }, 8000);
}

const castTxt = c => (c||[]).map(x => `${x.entity_id}/${x.variant_id||"default"}${x.view?`[${x.view}]`:""}`).join(", ");
async function loadReview(id){
  SEL = {review: id};
  document.querySelectorAll(".pg").forEach(e => e.classList.toggle("sel", +e.dataset.id === id));
  const r = await (await fetch(`${API()}/continuity/${id}`)).json();
  const v = r.review, D = $("#detail");
  const strip = (v.pages||[]).map(i => `<div class="pgimg"><a href="/debug/${ID}?page=${i}"><img loading="lazy" src="${API()}/pages/${i}/image"></a><div class="cap">p${i}</div></div>`).join("");
  const issues = (v.continuity_issues||[]).map(i => `<div class="issue sev${i.severity}">pages ${(i.pages||[]).join(", ")}: ${esc(i.issue)}<span class="rc">${esc(i.root_cause||"")}</span></div>`).join("") || `<div class="empty" style="padding:8px 0">No cross-page issues found.</div>`;
  const ents = (v.new_entities||[]).map(e => `<div class="prop"><h4>+ new ${esc(e.type)} <code>${esc(e.id)}</code> — ${esc(e.name)} <span class="rc" style="color:var(--muted)">pages ${(e.pages||[]).join(", ")}</span></h4>
    <div class="why">${esc(e.why||"")}</div><details><summary>appearance / sheet prompt</summary><pre>${esc(e.appearance)}

${esc(e.sheet_prompt||"")}</pre></details></div>`).join("");
  const vars = (v.new_variants||[]).map(e => `<div class="prop"><h4>+ new variant <code>${esc(e.entity_id)}/${esc(e.id)}</code> — ${esc(e.label)} <span class="rc" style="color:var(--muted)">pages ${(e.pages||[]).join(", ")}</span></h4>
    <div class="why">${esc(e.why||"")}</div><details><summary>appearance / sheet prompt</summary><pre>${esc(e.appearance)}

${esc(e.sheet_prompt||"")}</pre></details></div>`).join("");
  const edits = (v.page_edits||[]).map(e => `<div class="pedit"><b>p${e.idx}</b> <span class="badge ${e.action}">${e.action}</span>
    ${(e.problems||[]).length?`<ul class="iss">${e.problems.map(p=>`<li>${esc(p)}</li>`).join("")}</ul>`:""}
    ${e.edit_instruction?`<div class="fix"><b>edit →</b> ${esc(e.edit_instruction)}</div>`:""}
    ${e.brief?`<div class="fix"><b>brief →</b> ${esc(e.brief)}</div>`:""}
    ${e.setting?`<div class="fix"><b>setting →</b> ${esc(e.setting)}</div>`:""}
    ${(e.cast||[]).length?`<div class="fix"><b>cast →</b> ${esc(castTxt(e.cast))}</div>`:""}</div>`).join("");
  const nRedraw = (v.page_edits||[]).filter(e => e.action !== "keep").length;
  const applied = r.applied_at ? `<span class="badge kept">applied ${when(r.applied_at)}</span>` : "";
  D.innerHTML = `<div class="dhead"><h2>Continuity review · pages ${r.start_idx}–${r.end_idx}</h2>${applied}
      <button class="rbtn" id="rvApply" ${r.applied_at?"disabled":""}>Apply &amp; redraw</button>
      <button class="rbtn" id="rvApplyPlan" ${r.applied_at?"disabled":""} style="background:var(--panel);color:var(--accent)">Apply plan only</button>
      <button class="rbtn" id="rvDel" style="background:var(--panel);color:var(--bad);border-color:var(--line)">Delete</button></div>
    <div class="brief">${esc(v.summary||"")}</div>
    <div class="strip">${strip}</div>
    <div class="gen"><h3>Cross-page issues</h3>${issues}</div>
    ${ents||vars?`<div class="gen"><h3>Proposed registry additions</h3>${ents}${vars}</div>`:""}
    <div class="gen"><h3>Per-page recommendations</h3>${edits}</div>
    ${r.applied?`<div class="gen"><h3>Applied</h3><pre>${esc(JSON.stringify(r.applied, null, 1))}</pre></div>`:""}`;
  const apply = async (draw) => {
    const what = draw ? `Apply this review and redraw ${nRedraw} page(s) in the background (costs image generations)?`
                      : "Write the registry/page changes only? Affected pages keep their current pictures until redrawn.";
    if (!confirm(what)) return;
    $("#rvApply").disabled = $("#rvApplyPlan").disabled = true;
    const res = await (await fetch(`${API()}/continuity/${id}/apply`, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({draw})})).json();
    if (!res.ok) alert(res.error || "apply failed");
    await loadReviews(); await loadReview(id);
  };
  $("#rvApply").onclick = () => apply(true);
  $("#rvApplyPlan").onclick = () => apply(false);
  $("#rvDel").onclick = async () => {
    if (!confirm("Delete this review?")) return;
    await fetch(`${API()}/continuity/${id}`, {method:"DELETE"});
    SEL = null; $("#detail").innerHTML = `<div class="empty">Pick a review on the left.</div>`; await loadReviews();
  };
}

document.querySelectorAll(".tab").forEach(t => t.onclick = () => setMode(t.dataset.mode));
(async () => {
  const b = await (await fetch(API())).json();
  $("#title").textContent = (b.title || "Book") + " — generation debug";
  setMode("pages");
})();
</script>
</body></html>
